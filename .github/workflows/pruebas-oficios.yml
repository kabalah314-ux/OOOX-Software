# Pruebas de la app de oficios (OOOX Oficios). Corren solas:
#  - en cada cambio que toque la demo o sus pruebas, en cualquier rama;
#  - cada noche (solo desde la rama principal, que es como funciona GitHub), con el triple de recorridos al azar
#    y una semilla nueva cada día.
# La prueba de reglas estropeadas adrede tarda un minuto y corre siempre.
# El repositorio es público: las máquinas estándar de GitHub no cuestan nada. No usar máquinas «grandes».
name: Pruebas de la app de oficios
on:
  push:
    paths:
      - 'frontend/public/demos/ramirez-24h/**'
      - 'webs-negocios/demos/**'
      - '.github/workflows/pruebas-oficios.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruebas-oficios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reglas:
    name: Reglas y datos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reglas, datos, recorridos al azar, restos y reglas estropeadas adrede
        run: |
          export MUTANTES=1
          if [ "${{ github.event_name }}" = "schedule" ]; then export SEMILLA=$(date -u +%Y%m%d) TANDAS=300; fi
          bash webs-negocios/demos/pruebas.sh reglas
  pantallas:
    name: Pantallas en ${{ matrix.motor }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        motor: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright y el navegador
        # Versiones fijas: así una versión nueva del probador no hace fallar la prueba de la noche sin que haya cambiado la app.
        # Para subir de versión: cambiar el número aquí, mirar que las tres pasan y solo entonces dejarlo.
        run: |
          pip install playwright==1.65.1 pillow==13.0.0
          python -m playwright install --with-deps ${{ matrix.motor }}
      - name: Pantallas en ${{ matrix.motor }}
        env:
          NAVEGADOR: ${{ matrix.motor }}
        # Las pantallas se prueban con la hora fija (un martes a media mañana) y la app se repite a otras horas.
        # De noche se repite a siete: viernes y sábado de noche, festivo, fin de año, cambio de hora y los dos bordes de la tarifa.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then export HORAS="2026-11-13T20:10:00+01:00 2026-11-14T23:30:00+01:00 2026-12-08T11:00:00+01:00 2026-12-31T23:58:30+01:00 2027-03-28T01:58:30+01:00 2026-11-17T07:59:00+01:00 2026-11-20T19:58:30+01:00"; fi
          bash webs-negocios/demos/pruebas.sh navegador
