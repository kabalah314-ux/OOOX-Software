<!doctype html>
<html lang="es" data-demo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pide cita sin llamar</title>
<meta name="description" content="Pide cita sin llamar: eliges la avería, el día y la franja. Con cita, tarifa normal.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="assets/fuentes/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="oficio.css">
<style>
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--asfalto);border-bottom:1px solid var(--linea)}
@media (max-width:359px){#llama .ll-u{display:none}}
.wm{font:800 1.5rem/1 var(--fd);text-decoration:none;white-space:nowrap}
.wm span{margin-left:.22em;padding:.02em .22em;border-radius:4px;background:var(--senal);color:var(--negro)}
main{display:block;max-width:640px;margin:0 auto;padding:24px 18px calc(44px + var(--sb))}
main:focus{outline:0}
h1{font:800 1.75rem/1 var(--fd)}
.lead{margin-top:12px;font-size:1.125rem;color:var(--suave)}
.lead a{color:var(--texto);font-weight:600}
.ult{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--linea)}
.ult a{font-weight:600}
fieldset{border:0;min-width:0;display:grid;gap:14px;margin-top:30px}
legend{display:flex;gap:.45em;margin-bottom:14px;font:700 1.75rem/1 var(--fd)}
legend b{color:var(--senal)}
.avs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.avc{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;min-height:66px;padding:6px 10px 6px 6px;border-radius:12px;border:2px solid var(--control);font-weight:600;line-height:1.15;cursor:pointer}
.avc img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--asfalto-3)}
.avc input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avc:has(input:checked){border-color:var(--senal);background:var(--asfalto-3)}
.avc:has(input:focus-visible){outline:3px solid var(--senal);outline-offset:2px}
.rango{padding:12px 14px;border-radius:12px;background:var(--asfalto-2);border:1px solid var(--linea)}
.rango b{font:700 1.5rem/1.1 var(--fd)}
.rango small{display:block;margin-top:3px;font-size:.9375rem;color:var(--suave)}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{min-height:52px;padding:0 16px;border-radius:999px;border:2px solid var(--control);font-weight:600}
.op small{font-weight:400;color:var(--suave);margin-left:5px}
.op[aria-pressed=true],.op[aria-checked=true]{border-color:var(--senal);background:var(--asfalto-3)}
.op[role=radio]{display:inline-flex;align-items:center;gap:8px}
.op[role=radio]::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--control);box-sizing:border-box}
.op[role=radio][aria-checked=true]::before{border-color:var(--senal);background:radial-gradient(circle,var(--senal) 0 3.5px,transparent 4.5px)}
.op[disabled]{border-style:dashed;color:var(--tenue);cursor:not-allowed}
.otras{margin-top:18px}
/* el mapa del técnico de camino: nueve teselas alrededor de su última posición y un punto en el centro */
.mapa{margin-top:16px}
.mapa-v{position:relative;height:220px;max-width:512px;margin:0 auto;overflow:hidden;border-radius:12px;background:#dfe3e6}
.mapa-t{position:absolute;left:50%;top:50%;width:0;height:0}
.mapa-t img{position:absolute;width:256px;height:256px;max-width:none}
.mapa-p{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#ffc400;border:3px solid #15191c;box-shadow:0 0 0 7px rgba(255,196,0,.28)}
.mapa-l{margin-top:8px}
.mapa-f{margin-top:2px;font-size:.8125rem;text-align:right}
.otras .lb small{font-weight:400;color:var(--suave);margin-left:4px}
.lb{font-size:.9375rem;font-weight:600}
.duo{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:12px}
.fotoz{display:flex;align-items:center;gap:12px}
.fotoz img{width:76px;height:57px;object-fit:cover;border-radius:8px}
.zona{font-size:.9375rem;color:var(--bien)}
.legal{margin-top:18px;font-size:.9375rem;color:var(--suave)}
.nota-lang{margin-top:14px;padding:12px 14px 12px 16px;border-radius:12px;background:var(--asfalto-3);box-shadow:inset 4px 0 0 var(--control)}
form>.btn{margin-top:16px}
.fallo{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--mal-f);color:var(--mal);font-weight:600}
/* el resguardo del cliente: papel */
.doc h1{font:800 1.75rem/1 var(--fd)}
.doc .frase{margin-top:10px;font-size:1.125rem}
.doc .pista{margin:22px 0 6px}
.doc .pista li::before{background:var(--papel);border-color:#aeb4ba}
.doc .pista li::after{background:var(--raya)}
.doc .pista li.ok{color:var(--tinta)}
.doc .pista li.ok::before{background:var(--tinta);border-color:var(--tinta)}
.doc .pista li.ok::after{background:var(--tinta)}
.doc .pista li.ya::before{outline-color:rgba(23,25,27,.14)}
.doc .pista time{color:var(--tinta-2)}
.tras{display:grid;gap:10px;margin-top:18px}
.tras .txt{justify-self:center;display:inline-flex;align-items:center}
@media (min-width:560px){.avs{grid-template-columns:repeat(3,minmax(0,1fr))}h1,.doc h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.quien{display:flex;gap:12px;align-items:center;margin:16px 0}
.quien .ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:#fff;background:hsl(var(--h) 45% 36%);object-fit:cover}
.quien .coche{opacity:.8}
/* el servicio que viene elegido desde la web */
.elegida{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:12px;border:2px solid var(--senal);background:var(--asfalto-3)}
.elegida img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--asfalto-2)}
.elegida p{font-size:1.0625rem}
.obl{margin-top:22px;font-size:.9375rem;color:var(--suave)}
.fotow{display:grid;gap:6px}
/* lo que se enseña con scrollIntoView no se queda debajo de la cabecera fija */
.revisa,fieldset,.campo,.fallo,#tit{scroll-margin-top:72px}
.opc{font-weight:400;color:var(--suave);font-size:.875rem}
.rango .rk{display:block;font-size:.875rem;font-weight:600;color:var(--suave);margin-bottom:2px}
.plega{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600}
.plega::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:4px}
.plega[aria-expanded=true]::after{transform:rotate(-135deg) translate(-2px,-1px)}
#altL{display:grid;gap:10px}
/* el aviso de errores: cuántos y un enlace a cada uno */
.revisa{margin-top:18px;padding:14px 16px;border-radius:12px;border:2px solid var(--mal);background:var(--mal-f);color:var(--texto)}
.revisa:focus{outline:3px solid var(--mal);outline-offset:2px}
.revisa ul{margin:8px 0 0;padding-left:20px;list-style:disc;display:grid;gap:4px}
.revisa a{color:var(--texto);font-weight:600}
/* el resumen antes de confirmar */
.resu{margin-top:18px;border-top:1px solid var(--linea)}
.rf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.rf dt{grid-column:1;font-size:.875rem;font-weight:600;color:var(--suave)}
.rf dd{grid-column:1;margin:0;font-size:1.0625rem}
.rf dd small{font-size:.875rem;color:var(--suave)}
.rf .rc{grid-column:2;grid-row:1 / span 2;align-self:center}
.rf .rc a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--texto)}
.rfoto{width:96px;height:72px;object-fit:cover;border-radius:8px;margin-top:6px}
/* la confirmación: el número, qué pasa ahora y cómo cambiarla */
.conf{margin-top:20px;display:grid;gap:10px}
.conf h2{margin-top:8px;font:700 1.25rem/1.1 var(--fd)}
.conf .numero{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--raya)}
.conf .numero span{color:var(--tinta-2)}
.conf .numero b{font:800 1.5rem/1 var(--fd)}
.conf .numero .txt{color:var(--tinta)}
.conf .pasos{margin:0;padding-left:22px;list-style:decimal;display:grid;gap:4px}
.conf a{color:var(--tinta);font-weight:600}
</style>
</head>
<body>
<a class="vh" href="#v">Saltar al contenido</a>
<header class="top">
 <a class="wm" href="./" id="marca"></a>
 <button class="btn peq" id="llama"><span class="ll-u">¿Urgente? </span><span id="llamaTel"></span></button>
</header>
<main id="v" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/oficio-vigia.js" data-pagina="cita"></script>
<script src="js/oficio-nucleo.js"></script>
<script src="js/oficio-datos.js"></script>
<script src="js/oficio-espejo.js"></script>
<script src="js/oficio-estado.js"></script>
<script>
(function(){
'use strict';
const {K,N,cfg}=Oficio,$=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* el rótulo y el teléfono salen del archivo de datos del negocio */
const MARCA=esc(N.marca[0])+(N.marca[1]?'<span>'+esc(N.marca[1])+'</span>':'');
{const m=$('#marca'),b=$('#llama');m.innerHTML=MARCA;m.setAttribute('aria-label',N.nombre+': volver a la web');$('#llamaTel').textContent=N.tel;b.setAttribute('aria-label','¿Urgente? Llama al '+N.tel);
 if(!Oficio.DEMO){document.documentElement.removeAttribute('data-demo');b.addEventListener('click',e=>{e.stopImmediatePropagation();location.href='tel:+34'+K.tel9(N.tel)},true)}}
const mem={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S=Oficio.estado();
const P=new URLSearchParams(location.search),sv=P.get('servicio')||P.get('av'),av0=sv||mem.get('ramirez:av');
/* «servicio» (o «av»): la avería que se eligió en la web. Entonces sale arriba «Has elegido…», con un botón para cambiarla */
const B={av:cfg.av[av0]?av0:'',fijo:!!(sv&&cfg.av[sv]),nota:'',foto:'',dia:'',fr:'',alt:[],altOpen:false,altMas:false,nombre:'',apellidos:'',tel:'',dir:'',cp:'',err:'',errs:[],paso:'form'};
if(B.fijo)mem.set('ramirez:av',B.av);
/* desde «Pedir otra cita» de la zona del cliente: sus datos ya puestos, una sola vez */
{const y=mem.get('oficio:'+N.id+':yo');if(y){try{const o=JSON.parse(y);['nombre','apellidos','tel','dir','cp'].forEach(k=>{if(o&&typeof o[k]==='string')B[k]=k==='tel'?K.telBonito(o[k]):o[k]})}catch(e){}try{localStorage.removeItem('oficio:'+N.id+':yo')}catch(e){}}}
const ERR={av:'Elige qué necesitas arreglar.',franja:'Elige un día y una franja.',llena:'Esa franja se acaba de llenar. Elige otra.',nombre:'Escribe tu nombre.',apellidos:'Escribe tus apellidos.',tel:'El teléfono tiene que tener 9 cifras.',dir:'Escribe la calle y el número.',cp:'Falta el código postal.',zona:'Ahí todavía no llegamos: trabajamos en '+N.ciudad+'.'};
/* con servidor: los huecos los da él (días y franjas libres, sin cifras) y el aviso se sigue con la llave del enlace */
const SRV=Oficio.SRV,H={dias:null,err:'',t:0,va:false};
Object.assign(ERR,{servidor:'Algo ha fallado al enviar. Prueba otra vez o llámanos al '+N.tel+'.',limite:'Hoy ya no caben más peticiones desde aquí. Llámanos al '+N.tel+' y te damos cita.',red:'No hay conexión o no podemos recibirla ahora. Tu cita no se ha enviado: prueba otra vez o llámanos al '+N.tel+'.',lleno:'Hay mucha gente pidiendo a la vez. Prueba otra vez en unos segundos.',grande:'Esa foto pesa demasiado. Quítala y prueba otra vez.'});
function traeHuecos(){if(!SRV||H.va)return;H.va=true;Oficio.huecos({av:B.av||'',dis:cfg.zonas.cp[B.cp]||''}).then(r=>{H.va=false;H.t=Date.now();
 if(r.ok&&Array.isArray(r.dias)){H.err='';H.urg=r.urg&&Number.isInteger(r.urg.de)&&Number.isInteger(r.urg.a)?{de:r.urg.de,a:r.urg.a}:null;H.dias=r.dias.map(d=>({dia:d.dia,hoy:!!d.hoy,franjas:cfg.franjas.map(f=>{const x=(d.franjas||[]).find(y=>y.id===f.id);return{id:f.id,txt:K.franjaTxt(f),ok:!!(x&&x.ok),libres:null}})}))}else H.err=r.err||'red';
 const a=document.activeElement;if(ruta().v!=='aviso'&&!(a&&a.closest&&a.closest('#f input,#f textarea')))pinta()})}
const D3=['dom','lun','mar','mié','jue','vie','sáb'];
const diaCorto=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':D3[new Date(f+'T12:00:00Z').getUTCDay()]+' '+(+f.slice(8))};
const frTxt=id=>{const f=cfg.franjas.find(x=>x.id===id);return f?K.franjaTxt(f):''};
const toast=s=>{const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)};
const zonaDe=cp=>{const d=cfg.zonas.cp[String(cp).replace(/\D/g,'')];return d?cfg.zonas.dis[d][0]:''};

/* La cita todavía está solo en castellano. Si se llega desde la web en catalán o en inglés (?lang=), se dice arriba en
   ese idioma, con el teléfono por si prefiere llamar. */
const LANG=(location.search.match(/[?&]lang=(ca|en)/)||[])[1]||'';
const avisoLang=()=>LANG?'<p class="nota-lang" lang="'+LANG+'" role="note">'+(LANG==='ca'?'Aquest formulari encara és en castellà. Si et va millor, truca’ns al '+esc(N.tel)+'.':'This form is in Spanish for now. If you prefer, call us on '+esc(N.tel)+'.')+'</p>':'';
/* el precio orientativo: el mismo en la web, aquí, en el resumen y en la confirmación (sale del catálogo del negocio) */
const precioTxt=av=>{const R=K.rango(cfg,av,false);if(!R)return'';const e=x=>K.eur(x).replace(',00','');return R.b?'De '+e(R.a)+' a '+e(R.b):'Desde '+e(R.a)};
const PRECIO_NOTA='IVA incluido, en una vivienda. Con cita, tarifa normal. El precio final se cierra y lo firmas antes de empezar.';
/* lo que se puede comprobar antes de enviar (lo mismo que mira el núcleo); así se corrige todo de una vez */
function revisa(){const E=[],nm=s=>String(s||'').trim().replace(/\s+/g,' ');
 if(!B.av)E.push('av');if(!B.fr)E.push('franja');if(nm(B.nombre).length<2)E.push('nombre');if(nm(B.apellidos).length<2)E.push('apellidos');
 if(!K.tel9(B.tel))E.push('tel');if(nm(B.dir).length<5)E.push('dir');{const cp=String(B.cp).replace(/\D/g,'');if(!cfg.zonas.cp[cp])E.push(cp.length===5?'zona':'cp')}
 return E}
const CAMPO_DE={av:'av',franja:'fr',llena:'fr',nombre:'c_nombre',apellidos:'c_apellidos',tel:'c_tel',dir:'c_dir',cp:'c_cp',zona:'c_cp'};
const malEn=k=>B.errs.includes(k)||B.err===k;
function vPedir(){
 if(SRV&&!H.dias)return'<h1>Pide cita sin prisa.</h1><p class="lead" id="hEsp" role="status">'+(H.err?'No he podido mirar los huecos libres. <button class="txt" type="button" id="hOtra">Probar otra vez</button> o llama al '+esc(N.tel)+'.':'Mirando los huecos libres…')+'</p>';
 const dias=SRV?H.dias:K.diasDe(S,cfg,Date.now(),5,false,B.av?{av:B.av,cli:{dis:cfg.zonas.cp[B.cp]||''}}:null);
 if(!dias.length)return'<h1>Pide cita sin prisa.</h1><p class="lead">Ahora mismo no quedan huecos en los próximos días. Llama al '+esc(N.tel)+' y lo miramos.</p>';
 if(!dias.find(x=>x.dia===B.dia))B.dia=(dias.find(x=>!x.hoy)||dias[0]).dia;
 const fr=dias.find(x=>x.dia===B.dia).franjas;if(!fr.find(f=>f.id===B.fr&&f.ok))B.fr='';
 if(B.paso==='resumen'&&(!B.fr||revisa().length))B.paso='form';
 if(B.paso==='resumen')return vResumen(dias);
 /* otras franjas que también le van bien: las libres de ese día y de los dos siguientes. Plegadas: se abren si quiere,
    y se ven tres (o las que ya ha marcado); «Ver más» enseña hasta ocho. Cuatro marcadas como mucho */
 const i0=dias.findIndex(x=>x.dia===B.dia),cand=[];if(B.fr)dias.slice(i0,i0+3).forEach(x=>x.franjas.forEach(f=>{if(f.ok&&!(x.dia===B.dia&&f.id===B.fr)&&cand.length<8)cand.push({k:x.dia+'|'+f.id,txt:diaCorto(x.dia)+', '+f.txt})}));
 B.alt=B.alt.filter(k=>cand.some(c=>c.k===k));
 const verAlt=B.altMas?cand:cand.filter((c,i)=>i<3||B.alt.includes(c.k));
 const ult=mem.get('oficio:'+N.id+':mio'),U=ult&&(SRV?(Oficio.vista(ult)||{}).v:K.vistaCliente(S,cfg,ult));
 const c=(id,lb,v,o,ay)=>{const m=malEn(id)||(id==='cp'&&malEn('zona')),k=id==='cp'&&malEn('zona')?'zona':id;
  return'<div class="campo'+(m?' mal':'')+'"><label for="c_'+id+'">'+lb+'</label>'+(ay?'<p class="ayuda" id="a_'+id+'">'+ay+'</p>':'')+'<input id="c_'+id+'" data-b="'+id+'" value="'+esc(v)+'" '+(o||'')+(m?' aria-invalid="true"':'')+((m||ay)?' aria-describedby="'+[ay?'a_'+id:'',m?'e_'+id:''].filter(Boolean).join(' ')+'"':'')+'>'+(m?'<p class="err" id="e_'+id+'">'+ERR[k]+'</p>':'')+'</div>'};
 /* ¿no puede esperar?: en cuánto llegamos ahora de verdad (con lo que hay en marcha) y el suplemento de urgencia */
 const UA=SRV?H.urg:K.urgenciaAhora(S,cfg,null,Date.now(),''),sup=cfg.urge?' El servicio urgente lleva un suplemento de '+K.eur(cfg.cat[cfg.urge].p10).replace(',00','')+'.':'';
 const otra=B.av==='otra';
 /* arriba, si hay errores de los campos: cuántos y cuáles, con un enlace a cada uno */
 const resumenMal=B.errs.length?'<div class="revisa" id="revisa" role="alert" tabindex="-1"><p><b>'+(B.errs.length===1?'Revisa 1 dato':'Revisa '+B.errs.length+' datos')+'</b> antes de seguir:</p><ul>'+B.errs.map(k=>'<li><a href="#" data-ir="'+(CAMPO_DE[k]||k)+'">'+ERR[k]+'</a></li>').join('')+'</ul></div>':'';
 const elegida=B.fijo&&B.av?'<div class="elegida"><img src="assets/img/av-'+B.av+'-s.webp" alt="" width="52" height="52" onerror="this.style.visibility=\'hidden\'"><p>Has elegido <b>'+esc(cfg.av[B.av].n)+'</b></p><button type="button" class="btn peq" id="cambiaAv">Cambiar</button></div>':'';
 return'<h1>Pide cita sin prisa.</h1><p class="lead" id="urgLead">Con cita, la tarifa es siempre la normal. ¿No puede esperar? <a href="./">Llama o manda una foto</a>'+(UA?': ahora llegamos en unos '+UA.de+'–'+UA.a+' minutos.':'; ahora mismo no podemos decirte en cuánto llegamos: te lo decimos al llamar.')+sup+'</p>'+
  avisoLang()+(U&&U.e!=='cancelado'&&U.e!=='hecho'?'<p class="ult">Ya tienes un aviso: '+U.id+', '+esc(cfg.av[U.av].n.toLowerCase())+'. <a href="#/aviso/'+U.id+'">Ver cómo va</a>. Para cambiarlo, llámanos al '+esc(N.tel)+'.</p>':'')+
  resumenMal+
  '<form id="f" novalidate><p class="obl">Todo es necesario salvo lo que pone «Opcional».</p>'+
  '<fieldset id="av"><legend><b>1</b>¿Qué necesitas arreglar?</legend>'+
   (elegida||'<div class="avs">'+N.averias.map(a=>'<label class="avc"><img src="assets/img/av-'+a.id+'-s.webp" alt="" width="52" height="52" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span>'+esc(a.n)+'</span><input type="radio" name="av" value="'+a.id+'"'+(B.av===a.id?' checked':'')+'></label>').join('')+'</div>')+
   (malEn('av')?'<p class="fallo">'+ERR.av+'</p>':'')+
   (B.av?'<p class="rango"><span class="rk">Precio orientativo</span><b class="num">'+precioTxt(B.av)+'</b><small>'+PRECIO_NOTA+'</small></p>':'')+

/* un mapa sencillo, sin librerías: las nueve teselas de alrededor de un punto, con el punto en el centro */
function mapaHtml(M,pos,quien){const z=15,n=2**z,x=(pos.lon+180)/360*n,la=pos.lat*Math.PI/180,y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n;
 const tx=Math.floor(x),ty=Math.floor(y),ox=(x-tx)*256,oy=(y-ty)*256;let h='';
 for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=((tx+i)%n+n)%n,Y=ty+j;if(Y<0||Y>=n)continue;
  h+='<img alt="" width="256" height="256" decoding="async" src="'+esc(M.teselas.replace('{z}',z).replace('{x}',X).replace('{y}',Y))+'" style="left:'+(i*256)+'px;top:'+(j*256)+'px" onerror="this.style.visibility=\'hidden\'">'}
 return'<div class="mapa-v" role="img" aria-label="Mapa con la última posición de '+esc(quien)+'"><div class="mapa-t" style="transform:translate('+(-ox).toFixed(1)+'px,'+(-oy).toFixed(1)+'px)">'+h+'</div><i class="mapa-p"></i></div>'}
const haceMin=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'ahora mismo':m===1?'hace 1 minuto':m<60?'hace '+m+' minutos':'hace más de una hora'};
function bMapa(v,T){const M=cfg.mapa;if(!M||v.e!=='camino'||!v.pos)return'';const viejo=Date.now()-v.pos.t>5*60000,ok=typeof M.teselas==='string'&&/^https:\/\//.test(M.teselas);
 return'<section class="mapa" id="mapa" aria-label="Dónde está '+esc(T)+'">'+(ok?mapaHtml(M,v.pos,T):'')+
  '<p class="mapa-l"><b>Última posición de '+esc(T)+'</b>: '+haceMin(v.pos.t)+'.'+(viejo?' Puede que tenga la app cerrada mientras conduce.':'')+
  (ok?'':' <a href="https://www.openstreetmap.org/?mlat='+v.pos.lat+'&amp;mlon='+v.pos.lon+'#map=16/'+v.pos.lat+'/'+v.pos.lon+'" target="_blank" rel="noopener noreferrer">Abrirla en un mapa</a>')+'</p>'+
  (ok&&M.firma?'<p class="mapa-f">'+(typeof M.firmaUrl==='string'&&/^https:\/\//.test(M.firmaUrl)?'<a href="'+esc(M.firmaUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(M.firma)+'</a>':esc(M.firma))+'</p>':'')+'</section>'}

 const frase={nuevo:v.cita?'Para el '+cu+'. Te confirmamos enseguida quién irá.':'Te decimos enseguida quién va y a qué hora llega.',

 const p=[['Recibido',v.t],['Asignado',0],['De camino',v.sal],['En casa',v.ini],['Hecho',v.fin]];

/* con servidor: se pregunta por el aviso al abrirlo y cada pocos segundos mientras se mira; los huecos, al abrir y cada minuto */

 else{if((!H.dias&&!H.err)||Date.now()-H.t>60000)traeHuecos();const u=mem.get('oficio:'+N.id+':mio');if(u&&!Oficio.vista(u))Oficio.miraVista(u)}}

const repinta=id=>{const a=document.getElementById(id),p=a&&typeof a.selectionStart==='number'?a.selectionStart:null;pinta();const n=document.getElementById(id);if(n){n.focus({preventScroll:true});if(p!=null)try{n.setSelectionRange(p,p)}catch(e){}}};

async function envia(){if(B.va)return;B.va=true;B.err='';pinta();
 const r=await Oficio.crear({tipo:'pedir',av:B.av,origen:'cita',nota:B.nota,foto:B.foto,cli:{nombre:B.nombre,apellidos:B.apellidos,tel:B.tel,dir:B.dir,cp:B.cp},cita:{dia:B.dia,fr:B.fr},alt:B.alt.map(k=>({dia:k.split('|')[0],fr:k.split('|')[1]}))},{rol:'cliente'});
 B.va=false;
 if(!r.ok){if(SRV&&r.err==='franja'){H.t=0;traeHuecos()}const k=r.err==='franja'?'llena':r.err;B.err=k;
  /* si es de un dato (la franja se ha llenado, el teléfono…), se vuelve al formulario con ese dato marcado */

 mem.set('oficio:'+N.id+':mio',r.id);Object.assign(B,{nota:'',foto:'',fr:'',alt:[],err:'',errs:[],paso:'form',altOpen:false,altMas:false});location.hash='#/aviso/'+r.id}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dia],[data-fr],[data-alt],#llama,#cambiaAv,#altAbre,#altMas,#fQuita,[data-ir],[data-cambia],#rConfirma,#rVuelve,#copiaId');if(!b)return;
 if(b.id==='cambiaAv'){B.fijo=false;pinta();const n=$('input[name=av]:checked')||$('input[name=av]');if(n)n.focus();return}
 if(b.id==='altAbre'){B.altOpen=!(B.altOpen||B.alt.length>0);if(!B.altOpen)B.alt=[];pinta();const n=$('#altAbre');if(n)n.focus();return}
 if(b.id==='altMas'){B.altMas=true;pinta();const n=$('#altL [data-alt]:not([aria-pressed=true])');if(n)n.focus();return}
 if(b.id==='fQuita'){B.foto='';B.fotoMal='';pinta();const n=$('#c_foto');if(n)n.closest('label').focus();return}
 if(b.dataset.ir){e.preventDefault();irA(b.dataset.ir);return}

/* día y franja son de una sola opción (como en la app): Tab entra por la elegida y las flechas pasan de una a otra */
const RADIOS='[role=radiogroup]';
function ronda(g){const R=[...g.querySelectorAll('[role=radio]')],c=R.find(r=>r.getAttribute('aria-checked')==='true'&&!r.disabled)||R.find(r=>!r.disabled);R.forEach(r=>{const v=r===c?0:-1;if(r.tabIndex!==v)r.tabIndex=v})}
new MutationObserver(ms=>{const G=new Set();ms.forEach(m=>{const n=m.target.nodeType===1?m.target:m.target.parentElement;if(!n)return;const g=n.closest&&n.closest(RADIOS);if(g)G.add(g);
 if(m.type==='childList')m.addedNodes.forEach(x=>{if(x.nodeType!==1)return;if(x.matches(RADIOS))G.add(x);x.querySelectorAll(RADIOS).forEach(y=>G.add(y))})});G.forEach(ronda)})
 .observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-checked','disabled']});

 const a=[...x.attributes].find(z=>z.name.startsWith('data-')),sel=a?'['+a.name+'="'+CSS.escape(a.value)+'"]':null;

pinta();
document.querySelectorAll(RADIOS).forEach(ronda);
