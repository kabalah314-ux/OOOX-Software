<!doctype html>
<html lang="es" data-demo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La app por dentro · OOOX Oficios</title>
<meta name="description" content="La app de gestión de un fontanero, de ejemplo: los avisos llegan a la centralita, se reparten y el técnico los cierra con tres toques.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="assets/fuentes/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="oficio.css">
<style>
/* ===== el marco: en el móvil, barra arriba y pestañas abajo; en el ordenador, columna a la izquierda ===== */
body{padding-bottom:calc(64px + var(--sb))}
body.det{padding-bottom:0}
.lado{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--asfalto);border-bottom:1px solid var(--linea)}
.wm{font:800 1.5rem/1 var(--fd);text-decoration:none;white-space:nowrap}
.wm span{margin-left:.22em;padding:.02em .22em;border-radius:4px;background:var(--senal);color:var(--negro)}
.quien{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--control);font-weight:600;font-size:.9375rem}
.quien>svg{width:16px;height:16px;color:var(--suave)}
.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:hsl(var(--h,210) 28% 24%);color:hsl(var(--h,210) 70% 84%);font:700 1.05rem/1 var(--fd);font-style:normal}
.av.c{background:var(--asfalto-3);color:var(--texto)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--asfalto);border-top:1px solid var(--linea);padding-bottom:var(--sb)}
#nav a{position:relative;flex:1;display:grid;justify-items:center;align-content:center;gap:3px;min-height:64px;font-size:.8125rem;font-weight:600;color:var(--suave);text-decoration:none}
#nav a[aria-current]{color:var(--texto)}
#nav a[aria-current]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--senal)}
#nav svg{width:24px;height:24px}
#nav .n{position:absolute;top:8px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--senal);color:var(--negro);font-size:.75rem;line-height:20px;text-align:center}
body.det #nav{display:none}
.lado .demo{display:none}
main{display:block;max-width:720px;margin:0 auto;padding:18px 16px 26px}
main:focus{outline:0}
main.dos{padding:0;max-width:none}
main.dos>.col{padding:18px 16px 26px;max-width:720px;margin:0 auto}
main.dos.det>.lst,main.dos:not(.det)>.sin{display:none}
main.det.tecnico:not(.papelv){display:flex;flex-direction:column;min-height:calc(100svh - 56px)}
main.det.tecnico:not(.papelv)>.accion{margin-top:auto}
main>*:has(+ .accion){margin-bottom:18px}

/* ===== título de la pantalla ===== */
.atras{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 2px -6px;padding:0 8px 0 2px;font-weight:600;color:var(--suave);text-decoration:none}
.atras svg{width:20px;height:20px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cab h1,.cab .h1{font:700 1.5rem/1.1 var(--fd)}
.cab .sub{margin-top:5px;color:var(--suave)}
.cab .btn{flex:none}

/* ===== quién está dónde ===== */
.tira{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.tira li{display:flex;align-items:center;gap:8px;flex:none;min-height:46px;padding:5px 14px 5px 6px;border-radius:999px;border:1px solid var(--linea);font-size:.9375rem;white-space:nowrap}
.tira small{display:block;font-size:.8125rem;color:var(--suave)}
.tira .on small{color:var(--agua)}

/* ===== listas de avisos ===== */
.sec{margin-top:22px}
.sec>h2,.blq>h2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font:600 .9375rem/1.2 var(--fb);color:var(--suave)}
.sec>h2 .n{color:var(--tenue);font-weight:400}
.lista{display:grid;gap:8px}
.fila{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;min-height:68px;padding:11px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.fila .f1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .f2{grid-column:1;font-size:.9375rem;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .fd{grid-column:2;grid-row:1/3;display:grid;justify-items:end;gap:3px;font-weight:600}
.fila .mini{font-size:.875rem;font-weight:400;color:var(--suave)}
.fila.urg{padding-left:24px}
.fila.urg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:11px 0 0 11px;background:var(--cinta-fina)}
.fila[aria-current]{background:var(--asfalto-3);border-color:var(--control)}
.hueco{padding:14px;border-radius:12px;border:1px dashed var(--control);color:var(--suave);font-size:.9375rem}

/* ===== el aviso por dentro ===== */
.pista{margin-top:18px}
.blq{margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.blq .gr{font-weight:600;font-size:1.125rem}
.blq .dir{font:700 1.5rem/1.15 var(--fd)}
.blq .ln{color:var(--suave)}
.blq .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.blq .cita{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dice{margin-top:12px;padding-left:12px;border-left:3px solid var(--control);color:var(--texto)}
.fotoc{margin-top:12px;width:132px;height:99px;object-fit:cover;border-radius:8px}
.ojo{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--aviso-f);color:var(--senal-2)}
.ojo a{font-weight:600}
.tecs{display:grid;gap:8px}
.tec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border-radius:12px;border:2px solid var(--control)}
.tec small{display:block;font-size:.875rem;color:var(--suave)}
.tec b{font-weight:600}
.tec[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.tec.no{border-style:dashed}
.tec .va{font-size:.875rem;font-weight:600;color:var(--senal-2)}
.gordo{font:700 2.25rem/1 var(--fd)}
.lins{margin-top:10px}
.lins li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--linea);font-size:.9375rem}
.lins li span:first-child{color:var(--suave)}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msgs li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-top:1px solid var(--linea)}
.msgs li:first-child{border-top:0}
.msgs small{display:block;font-size:.875rem;color:var(--suave)}
.hist{margin-top:12px;padding:0 14px;border-radius:12px;border:1px solid var(--linea)}
.hist summary{min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--suave);cursor:pointer}
.hist ol{padding-bottom:10px}
.hist li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:5px 0;font-size:.9375rem}
.hist time{color:var(--suave)}
.fin{margin-top:16px;text-align:center}
.reloj{display:flex;align-items:center;justify-content:space-between;gap:12px}
.reloj b{font:700 2.5rem/1 var(--fd)}
.reloj small{display:block;font-size:.875rem;color:var(--suave);margin-top:2px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fotos img{width:88px;height:66px;object-fit:cover;border-radius:8px}

/* ===== la acción de la pantalla, siempre al alcance del pulgar ===== */
.accion{position:sticky;bottom:0;z-index:10;display:grid;gap:4px;justify-items:center;margin:auto -16px -26px;padding:12px 16px calc(12px + var(--sb));background:var(--asfalto);border-top:1px solid var(--linea)}
.accion .ln{font-size:.9375rem;color:var(--suave)}

/* ===== hoy, para el técnico ===== */
.sig{position:relative;display:grid;gap:10px;margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--control);background:var(--asfalto-2)}
.sig.urg{padding-top:26px}
.sig.urg::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:13px 13px 0 0;background:var(--cinta-fina)}
.sig .k{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--suave);font-size:.9375rem}
.sig h2{font-size:1.75rem}
.sig .dir{font-weight:600;font-size:1.125rem}

/* ===== agenda ===== */
.dias{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias a{flex:1;display:grid;justify-items:center;align-content:center;gap:1px;min-width:0;min-height:76px;padding:0 4px;border-radius:12px;border:1px solid var(--linea);text-decoration:none;color:var(--suave);font-size:.875rem}
.dias a b{font:700 1.5rem/1 var(--fd);color:var(--texto)}
.dias a small{font-size:.75rem;color:var(--tenue)}
.dias a[aria-current]{background:var(--asfalto-3);border-color:var(--control);color:var(--texto)}
.tabla{display:grid;gap:14px;margin-top:8px}
.sem{display:grid;gap:10px;margin-top:18px}
.semc,.semf{display:grid;grid-template-columns:84px repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.semc span{font-size:.875rem;color:var(--suave)}
.semf{padding-top:10px;border-top:1px solid var(--linea)}
.semd{font-size:.875rem;color:var(--suave)}
.semd b{display:block;font:700 1.5rem/1.1 var(--fd);color:var(--texto)}
.semf [role=cell]{display:grid;gap:6px}
.cch{display:block;padding:9px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.cch b,.cch small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cch b{font-weight:600}
.cch small{font-size:.875rem;color:var(--suave)}
.cch.sin small{color:var(--senal-2)}
.sem .hueco{padding:9px 12px;font-size:.875rem}
.hueco.of{border-color:var(--senal);color:var(--senal-2)}
.seg a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--suave);text-decoration:none}
.seg a[aria-current]{background:var(--asfalto-3);color:var(--texto)}
.segv{margin-top:14px}
.alertas{display:grid;gap:8px;margin-top:12px}
.alertas li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--aviso-f);color:var(--senal-2)}
.alertas .btn{flex:none;border-color:currentColor;color:inherit}
.tecds{display:grid;gap:12px;margin-top:14px}
.tecd{padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.tecd>h2{display:flex;align-items:center;gap:10px;font:700 1.25rem/1.1 var(--fd)}
.tecd>.ln{margin-top:6px;color:var(--suave);font-size:.9375rem}
.tecd.aus>.ln{color:var(--mal)}
.tfr{display:grid;gap:6px;margin-top:10px}
.tfr li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start}
.tfr li>.num{padding-top:10px;font-size:.9375rem;color:var(--suave)}
.tfr li>div{display:grid;gap:6px}
.tfr .hueco{padding:9px 12px;font-size:.875rem}
.tfr .eqn{padding:9px 12px;border-radius:12px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--asfalto-3) 6px 7px);color:var(--tenue);font-size:.875rem}
.tecd .acts{margin-top:12px}
.filau{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 12px 8px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.filau small{display:block;color:var(--suave);font-size:.875rem}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--senal)}
.fr>h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 8px;font:700 1.25rem/1 var(--fd)}
.fr>h3 small{font:400 .875rem/1 var(--fb);color:var(--suave)}

/* ===== cobros ===== */
.cifras{display:grid;grid-template-columns:repeat(2,1fr);margin-top:8px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.cifras div{padding:12px 14px;border-top:1px solid var(--linea)}
.cifras div:nth-child(-n+2){border-top:0}
.cifras div:nth-child(even){border-left:1px solid var(--linea)}
.cifras dt{font-size:.875rem;color:var(--suave)}
.cifras dd{font:700 1.5rem/1.1 var(--fd);margin-top:2px}

/* ===== formularios ===== */
.form{display:grid;gap:16px;margin-top:16px}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{min-height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--control);font-weight:600}
.op small{font-weight:400;color:var(--suave);margin-left:4px}
.op[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.op[disabled]{border-style:dashed;color:var(--tenue);cursor:not-allowed}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--asfalto-2);border:1px solid var(--linea)}
.seg button{min-height:44px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--suave)}
.seg button[aria-pressed=true]{background:var(--asfalto-3);color:var(--texto)}
.seg.tres{display:flex}.seg.tres button{flex:1 1 auto;min-width:0;padding:0 8px}
.duo{display:grid;grid-template-columns:1fr 120px;gap:12px}
.lb{font-size:.9375rem;font-weight:600}
.hoja .ops .op{border-color:var(--control)}
/* lo elegido se tiene que ver de un vistazo, también dentro de una hoja (la forma de pago, el plan, cómo dice que sí) */
.hoja .ops .op[aria-pressed=true]{border-color:var(--senal);box-shadow:inset 0 0 0 1px var(--senal)}
.hoja.papel .ops .op[aria-pressed=true]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.hoja.papel .op{border-color:#aeb4ba}
.hoja.papel .op small{color:var(--tinta-2)}
.hoja.papel .op[aria-pressed=true]{border-color:var(--tinta);background:var(--papel-2)}
.hoja.papel .op[disabled]{color:#70777e}

/* ===== el precio que firma el cliente (papel) ===== */
.hoja .dn{font-size:.9375rem;color:var(--suave)}
.hoja.papel .dn{color:var(--tinta-2)}
.tar{font-weight:600}
.plin li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--raya)}
.plin .lt small{display:block;font-size:.875rem;color:var(--tinta-2)}
.plin b{font-weight:600;min-width:76px;text-align:right}
.st{display:flex;gap:6px}
.st button{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:2px solid #aeb4ba;font-size:1.4rem;font-weight:600;line-height:1}
.st button[disabled]{color:#aeb4ba;border-color:var(--raya);cursor:not-allowed}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--tinta)}
.ptot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:10px;border-top:2px solid var(--tinta);font:800 2.25rem/1 var(--fd)}
.hoja .iva{font-size:.9375rem;color:var(--tinta-2);text-align:right;margin-top:-8px}
.sube{padding:10px 12px;border-radius:10px;background:#fff3c4;color:#4d3b00;font-weight:600}
.firma{display:grid;gap:6px}
.firma .fh{display:flex;justify-content:space-between;align-items:center}
.firma canvas{width:100%;height:150px;border-radius:10px;border:2px dashed #aeb4ba;background:#fff}
.otro{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}

/* ===== papeles en pantalla ===== */
main.papelv{max-width:760px}
.vdocs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:6px 0 14px}
.vdocs a{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;min-height:44px;padding:6px 8px;border-radius:12px;border:1px solid var(--linea);text-decoration:none;font-weight:600;color:var(--suave)}
.vdocs a[aria-current]{background:var(--asfalto-3);border-color:var(--control);color:var(--texto)}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ===== el menú de la demo ===== */
.mrol{display:grid;gap:8px}
.mnota{font-size:.9375rem;color:var(--suave)}
.pets{display:grid;gap:8px}
.pet{padding:12px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.pet.nueva{border-color:var(--senal)}
.pet .pc{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pet .pt{font-weight:600}
.pet .px{margin-top:6px;white-space:pre-line;overflow-wrap:anywhere}
.pet .pm{margin-top:6px;font-size:.875rem;color:var(--suave)}
.pet .pr{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--asfalto-3)}
.pet .pr .lb{display:block;margin-bottom:2px;font-size:.875rem;color:var(--suave)}
.pet .pr p{white-space:pre-line;overflow-wrap:anywhere}
.pet a.txt{display:inline-flex;align-items:center;margin-top:4px}
.mpie{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:10px;font-size:.9375rem;color:var(--suave)}

@media (min-width:960px){
 body{padding-bottom:0}
 .marco{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100svh}
 .lado{position:sticky;top:0;height:100svh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:16px;padding:22px 14px 18px;border-bottom:0;border-right:1px solid var(--linea)}
 .wm{padding:0 8px;font-size:1.75rem}
 .quien{justify-content:flex-start;border-radius:12px;padding:6px 10px 6px 8px}
 .quien>svg{margin-left:auto}
 #nav{position:static;flex-direction:column;gap:2px;padding:0;border:0;background:none}
 #nav a{display:flex;justify-items:start;align-content:normal;align-items:center;gap:12px;flex:none;min-height:46px;padding:0 12px;border-radius:10px;font-size:1rem}
 #nav a[aria-current]{background:var(--asfalto-3)}
 #nav a[aria-current]::before{display:none}
 #nav .n{position:static;margin-left:auto}
 body.det #nav{display:flex}
 .lado .demo{display:block;margin-top:auto;padding:0 8px;font-size:.875rem;color:var(--tenue)}
 .cab h1,.cab .h1{font-size:1.75rem}
 main{margin:0;max-width:1240px;padding:30px 36px 40px}
 main.estrecha{max-width:760px;margin:0 auto}
 .tecds{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
 .cifras{grid-template-columns:repeat(4,1fr)}
 .cifras div{border-top:0}
 .cifras div+div{border-left:1px solid var(--linea)}
 main.tecnico{max-width:600px;margin:0 auto}
 main.dos{display:grid;grid-template-columns:minmax(380px,1fr) minmax(0,1.5fr);max-width:none}
 main.dos>.col{max-width:none;margin:0;height:100svh;overflow-y:auto;padding:30px 28px 40px}
 main.dos>.col+.col{border-left:1px solid var(--linea)}
 main.dos.det>.lst,main.dos:not(.det)>.sin{display:block}
 main.dos .atras{display:none}
 main.tecnico .accion{margin:auto -36px -40px;padding:14px 36px}
 main.det.tecnico:not(.papelv){min-height:100svh}
 .tabla{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* con servidor: el aviso de conexión y la pantalla de entrar */
#red{position:absolute;left:0;right:0;top:100%;margin:0;padding:7px 16px;background:var(--aviso-f);color:var(--senal-2);border-bottom:1px solid var(--linea);font-size:.8125rem;line-height:1.35;text-align:center}
body.conred main,body.conred main.dos>.col{padding-top:52px}
body.conred main.dos{padding-top:0}
.entra{max-width:420px;margin:0 auto}
.entra form{display:grid;gap:16px;margin-top:20px}
.entra .ver{justify-self:start;margin-top:6px}
.entra .ojo{margin-top:16px}
@media (min-width:960px){

<script>
(function(){
'use strict';
const {K,N,cfg}=Oficio,$=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
/* lo que cambia de un negocio a otro sale siempre del archivo de datos: rótulo, ciudad, recargo y el concepto que va por horas */
const PCT=Math.round(cfg.recargo*100),HK=cfg.horas,HIT=HK?cfg.cat[HK]:null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),FIJO=P.has('fijo');
if(P.has('solo'))document.documentElement.classList.add('solo');
let Q=P.get('papel')==='tecnico'?{rol:'tecnico',id:cfg.tec[P.get('tec')]?P.get('tec'):N.tecnicos[0].id}:{rol:'centralita',id:'oficina'};
/* con servidor no se elige papel: cada uno entra con su código y la app es la suya */
const SRV=Oficio.SRV,quienEntra=()=>{const s=SRV?Oficio.sesion():null;if(s)Q={rol:s.rol,id:s.id};return!SRV||!!s};
quienEntra();
let S=Oficio.estado();
const pro=()=>true;   /* desde el 13-11-2026 todos los negocios llevan papeles y cobros */
const MARCA=esc(N.marca[0])+(N.marca[1]?'<span>'+esc(N.marca[1])+'</span>':'');
{const m=$('#marca');m.innerHTML=MARCA;m.setAttribute('aria-label',N.nombre+': inicio de la app');if(!Oficio.DEMO)$$('.demo').forEach(e=>e.remove())}
const sv=(d,x)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(x||'')+'>'+d+'</svg>';
const I={mas:sv('<path d="M12 5v14M5 12h14"/>'),atras:sv('<path d="M15 5l-7 7 7 7"/>'),x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),baja:sv('<path d="M6 9l6 6 6-6"/>'),
 tel:sv('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),mapa:sv('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.800-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
 bandeja:sv('<path d="M4 13l2-8h12l2 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h5l1 2h4l1-2h5"/>'),agenda:sv('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'),
 euro:sv('<path d="M17 7a6 6 0 1 0 0 10M5 10h8M5 14h8"/>'),hoy:sv('<path d="M5 6h14M5 12h14M5 18h9"/>'),hecho:sv('<path d="M5 12.5l4.500 4.500L19 7"/>'),
 mejoras:sv('<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8.5 9.5h7M8.5 12.5h4"/>')};
const hace=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'ahora mismo':m<60?'hace '+m+' min':m<1440?'hace '+Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):'hace '+Math.floor(m/1440)+' d'};
const dur=m=>m<1?'menos de 1 min':m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');
const frTxt=id=>{const f=cfg.franjas.find(x=>x.id===id);return f?K.franjaTxt(f):''};
/* cuántas citas caben: un número fijo, o lo que salga de los horarios de cada técnico */
const CABEN=cfg.conHorario?'Los huecos salen del horario de cada técnico':'Caben '+cfg.cupo+' por franja';
const D3=['dom','lun','mar','mié','jue','vie','sáb'];
const diaTxt=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':'el '+K.fechaLarga(f)};
const diaCorto=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':D3[new Date(f+'T12:00:00Z').getUTCDay()]+' '+(+f.slice(8))};
const cuandoT=t=>{const f=K.madrid(t).date,h=K.madrid().date;return(f===h?'':f===K.masDias(h,-1)?'ayer, ':K.fechaCorta(f)+', ')+K.hora(t)};
const barrio=A=>A.cli.dis?cfg.zonas.dis[A.cli.dis][0]:'';
const ORIG={llamada:'por teléfono',web:'desde la web',cita:'cita en la web',whatsapp:'por WhatsApp',persona:'en persona',otro:'por otro canal'};
const EST={nuevo:'Sin asignar',asignado:'Asignado',camino:'De camino',curso:'Trabajando',hecho:'Terminado',ausente:'No había nadie',cancelado:'Cancelado'};
const PAGO={efectivo:'Efectivo',tarjeta:'Tarjeta',bizum:'Bizum',transferencia:'Transferencia',pendiente:'Lo paga después'};
const ERR={nombre:'Escribe el nombre del cliente.',apellidos:'Escribe los apellidos del cliente.',tel:'El teléfono tiene que tener 9 cifras.',telAviso:'El contrato tiene que ser para el teléfono del cliente de este aviso.',dir:'Escribe la calle y el número.',cp:'Falta el código postal.',zona:'Ese código postal queda fuera de '+N.ciudad+': ahí no llegamos.',av:'Elige qué le pasa.',tec:'Ese técnico no existe.',foto:'Esa foto pesa demasiado.',vacio:'No hay nada que apuntar.',franja:'Esa franja ya está llena. Elige otra.',
 datos:'Faltan el teléfono y la dirección del cliente.',ocupado:'Ya tienes otro aviso en marcha. Termínalo antes.',firma:'Falta la firma del cliente.',lineas:'El presupuesto está vacío.',pide:'Falta que el cliente marque «Quiero que lo hagáis ya».',plan:'Elige un plan.',ya:'Ese cliente ya tiene un contrato en esa dirección.',acepta:'Falta que el cliente diga que sí: que firme o que lo diga por mensaje.',contrato:'No encuentro ese contrato.',fecha:'Aún no toca renovarlo: se renueva el último mes.',motivo:'El motivo tiene que ser un texto.',falta:'Eso no vale como material: elige uno de la lista o escríbelo, de 1 a 20 unidades y hasta 12 cosas por aviso.',num:'Ese número de factura no vale.',modo:'Elige cómo paga.',estado:'El aviso ha cambiado mientras tanto. Míralo otra vez.',permiso:'Este aviso no es tuyo.',fotos:'Ya hay cuatro fotos.',
 horario:'Ese técnico no trabaja a esa hora. Elige a otro.',ausente_tec:'Ese técnico está ausente ese día.',lleno:'Ese técnico ya tiene esa franja ocupada.',
 red:'Sin conexión con el servidor. No se ha creado: mira si aparece antes de repetirlo.',lleno:'El servidor está ocupado. Prueba otra vez en unos segundos.',sesion:'Tu sesión se ha cerrado. Entra otra vez.',espera:'Eso tiene que confirmarlo el servidor.',
 fechas:'Revisa las fechas de la ausencia.',mapa:'Este negocio no tiene activado el mapa.',posicion:'Esa posición no vale.',ausencia:'Esa ausencia ya no está apuntada.',aviso:'Ese aviso ya no existe.'};
/* por qué no puede ir un técnico a un aviso; sale de las reglas (K.puedeIr), aquí solo se dice con palabras */
/* la oficina puede poner una cita donde el cliente no: en el hueco que se guarda para urgencias y con menos de dos horas */
const POR={margen:'menos de 2 h',reserva:'hueco de urgencias','reserva+margen':'hueco de urgencias'};
const PORL={margen:'Queda a menos de dos horas. El cliente ya no puede pedirla; la oficina, sí.',reserva:'Usa el hueco que se guarda para urgencias. El cliente no la ve; la oficina, sí.','reserva+margen':'Es hoy mismo y usa el hueco que se guarda para urgencias. Solo la puede poner la oficina.'};
const PORA={margen:'La puso la oficina con menos de dos horas de margen.',reserva:'La puso la oficina en el hueco que se guarda para urgencias.','reserva+margen':'La puso la oficina hoy mismo, en el hueco que se guarda para urgencias.'};
const frOf=f=>f.ok?(f.libres===1?'queda 1':'quedan '+f.libres):f.okOf?POR[f.por]:!f.tope?'nadie trabaja':!f.libresOf?'llena':'ya ha pasado';
const abiertos=['nuevo','asignado','ausente'];
const NOVA={ausente_tec:()=>'Ausente ese día',lleno:()=>'Ya tiene esa franja ocupada',horario:A=>A.cita?'No trabaja en esa franja':'Ahora no trabaja y no hace guardias'};
const ava=id=>{const t=cfg.tec[id];return t?'<i class="av" style="--h:'+t.tono+'" aria-hidden="true">'+t.n[0]+'</i>':'<i class="av c" aria-hidden="true">C</i>'};
const lq=l=>l.un==='h'?dur(Math.round(l.q*60)):l.q>1?l.q+' unidades':'';
const toast=s=>{const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)};
const hacer=a=>{const r=Oficio.hacer(a,Q);if(!r.ok)toast(ERR[r.err]||'No se ha podido hacer.');return r};
const el=id=>S.avisos.find(a=>a.id===id);

/* ===== hojas ===== */
function hoja(html,o){o=o||{};const d=document.createElement('dialog');d.className='hoja'+(o.papel?' papel':'')+(o.llena?' llena':'');d.innerHTML=html;document.body.appendChild(d);
 d.addEventListener('close',()=>d.remove());
 d.addEventListener('click',e=>{if(e.target.closest('[data-x]')||(e.target===d&&!o.fijo))d.close()});
 d.showModal();return d}
const hc=t=>'<div class="hc"><h2>'+t+'</h2><button class="x" data-x aria-label="Cerrar">'+I.x+'</button></div>';
const waHtml=(txt,a)=>'<div class="wa"><div class="wa-hd"><i>'+esc((a||'C')[0])+'</i><span>'+esc(a||'Cliente')+'<small>WhatsApp</small></span></div><div class="wa-chat"><div class="wa-b">'+esc(txt)+'<time>'+K.hora(Date.now())+'</time></div></div></div>';

/* ===== piezas ===== */
function pista(A){const p=[['Recibido',A.t],['Asignado',A.tec&&A.e!=='nuevo'?1:0],['De camino',A.sal],['En casa',A.ini],['Hecho',A.fin]],orden={nuevo:0,ausente:0,cancelado:0,asignado:1,camino:2,curso:3,hecho:4}[A.e];
 return'<ol class="pista" aria-label="Recorrido del aviso">'+p.map((x,i)=>'<li class="'+(i<=orden?'ok':'')+(i===orden?' ya':'')+'"'+(i===orden?' aria-current="step"':'')+'>'+x[0]+(x[1]>1&&i<=orden?'<time>'+K.hora(x[1])+'</time>':'')+'</li>').join('')+'</ol>'}
function fila(A,sel){const av=cfg.av[A.av],t=cfg.tec[A.tec],quien=K.nomCli(A.cli)||'Aún sin nombre';let f2,fd;
 const cita=A.cita?'cita '+diaCorto(A.cita.dia)+', '+frTxt(A.cita.fr):'';
 const pc=A.cita&&A.cita.ok===false?' · por confirmar':'';
 if(A.e==='nuevo'||A.e==='ausente'){f2=cita?quien+' · '+cita+pc:hace(A.t).replace(/^h/,'H').replace(/^a/,'A')+' · '+quien+' · '+ORIG[A.origen];fd='<span class="pill '+(A.e==='ausente'?'ausente':'nuevo')+'">'+(A.e==='ausente'?'No había nadie':!A.cli.tel?'Faltan datos':A.reasignar?'Reasignar':'Sin asignar')+'</span>'}
 else if(A.e==='hecho'){f2=(t?t.n+' · ':'')+quien;fd=A.tot&&A.pago&&pro()?'<span class="num">'+K.eur(A.tot.total)+'</span>'+(A.pago.cobrado?'<span class="mini">'+(A.tot.total?PAGO[A.pago.modo]:'En su contrato')+'</span>':'<span class="pill cobro">Por cobrar</span>'):'<span class="pill hecho">Terminado</span>'}
 else if(A.e==='cancelado'){f2=quien;fd='<span class="pill">Cancelado</span>'}
 else{f2=(t?t.n+' · ':'')+(A.e==='camino'?'llega sobre las '+K.hora(A.eta):A.e==='curso'?'lleva '+dur(K.minutos(A,Date.now())):cita?cita+pc:'urgente, '+hace(A.t));fd='<span class="pill '+A.e+'">'+EST[A.e]+'</span>'}
 return'<li><a class="fila'+(A.urg&&(A.e==='nuevo'||A.e==='ausente')?' urg':'')+'" href="#/aviso/'+A.id+'"'+(sel===A.id?' aria-current="true"':'')+'><span class="f1">'+esc(av.n)+(barrio(A)?' · '+esc(barrio(A)):'')+'</span><span class="f2">'+esc(f2)+(A.con&&A.e!=='hecho'&&A.e!=='cancelado'?' · con contrato':'')+'</span><span class="fd">'+fd+'</span></a></li>'}
const sec=(tit,L,sel,vacio)=>'<section class="sec"><h2>'+tit+' <span class="n">'+L.length+'</span></h2>'+(L.length?'<ul class="lista">'+L.map(a=>fila(a,sel)).join('')+'</ul>':'<p class="hueco">'+vacio+'</p>')+'</section>';
function tira(){const r=K.resumen(S,cfg,Date.now());
 return'<ul class="tira" aria-label="Dónde está cada técnico">'+N.tecnicos.map(t=>{const x=r.tec[t.id],A=x.aviso&&el(x.aviso);
  const lib=K.ocupacion(S,cfg,t.id,Date.now()),fin=lib?' · libre ~'+K.hora(Date.now()+lib*60000):'';
  return'<li class="'+(x.e!=='libre'?'on':'')+'">'+ava(t.id)+'<span>'+esc(t.n)+'<small>'+(x.e==='curso'?'trabajando en '+esc(barrio(A))+fin:x.e==='camino'?'de camino a '+esc(barrio(A))+fin:lib?'con urgencias en cola'+fin:'libre')+'</small></span></li>'}).join('')+'</ul>'+bUrgAhora()}
/* para una urgencia que entre ahora: quién llega antes y en cuánto, o que no hay nadie sin dejar tirada una cita */
function bUrgAhora(){const L=K.llegadas(S,cfg,null,Date.now(),'').filter(x=>!x.choca&&!x.fuera);
 return'<p class="ojo" id="urgAhora">'+(L.length?'Para una urgencia ahora: '+esc(cfg.tec[L[0].tec].n)+(L[0].libre?', libre hacia las '+K.hora(Date.now()+L[0].libre*60000):', libre ya')+'. Llega en '+(L[0].libre?'unos '+L[0].llega+' min':'lo que se tarde hasta el barrio (de '+Math.min.apply(null,Object.values(cfg.zonas.banda))+' a '+cfg.etaMax+' min)')+'.':'Para una urgencia ahora no hay nadie libre sin llegar tarde a una cita o salirse de su horario.')+'</p>'}

/* ===== centralita: la bandeja ===== */
function vBandeja(sel){const r=K.resumen(S,cfg,Date.now()),hoy=K.madrid().date,H=sel?'p class="h1"':'h1',Hc=sel?'p':'h1';
 const pri=a=>a.con&&a.con.pri?1:0,pend=S.avisos.filter(a=>a.e==='nuevo'||a.e==='ausente').sort((a,b)=>(b.urg-a.urg)||(pri(b)-pri(a))||(a.t-b.t));
 const marcha=S.avisos.filter(a=>['asignado','camino','curso'].includes(a.e)).sort((a,b)=>({curso:0,camino:1,asignado:2}[a.e]-{curso:0,camino:1,asignado:2}[b.e])||(a.t-b.t));
 const hechos=S.avisos.filter(a=>a.e==='hecho'&&K.madrid(a.fin).date===hoy).sort((a,b)=>b.fin-a.fin);
 const u=pend.find(a=>a.urg);
 const sub=u?(r.urgentes===1?'1 urgente sin asignar, ':r.urgentes+' urgentes sin asignar, el primero ')+hace(u.t)+'.':pend.length?(pend.length===1?'1 cita por asignar':pend.length+' avisos por asignar')+', ninguno urgente.':'Todo repartido.';
 return'<div class="cab"><div><'+H+'>Bandeja</'+Hc+'><p class="sub">'+sub+'</p></div><a class="btn pri peq" href="#/nuevo">'+I.mas+'Nuevo aviso</a></div>'+bAlertas()+tira()+
  sec('Por atender',pend,sel,'No queda ningún aviso por atender.')+sec('En marcha',marcha,sel,'Ahora no hay ningún aviso en marcha.')+sec('Hechos hoy',hechos,sel,'Hoy todavía no se ha terminado ninguno.')}
function vElige(){const r=K.resumen(S,cfg,Date.now());
 return'<p class="hueco">Elige un aviso de la lista para verlo. Hoy: '+r.hechos+(r.hechos===1?' hecho':' hechos')+', '+r.marcha+' en marcha'+(pro()&&r.pend.n?' y '+r.pend.n+' por cobrar ('+K.eur(r.pend.total)+')':'')+'.</p>'}

/* ===== el aviso ===== */
function bCliente(A,esT){const c=A.cli;let h='<section class="blq"><h2>Cliente</h2>';
 if(!c.tel)return h+'<p class="gr">Aviso desde la web'+(barrio(A)?', en '+esc(barrio(A)):'')+'</p><p class="ln">Ha abierto WhatsApp desde la web '+hace(A.t)+'. El teléfono y la dirección llegan con su mensaje.</p>'+(esT?'':'<div class="acts"><button class="btn pri" data-a="completar" data-id="'+A.id+'">Completar los datos</button></div>')+'</section>';
 h+=(esT?'<p class="dir">'+esc(c.dir)+'</p><p class="ln">'+esc(c.cp)+' '+esc(barrio(A))+' · '+esc(K.nomCli(c))+'</p>':'<p class="gr">'+esc(K.nomCli(c))+'</p><p class="ln">'+esc(c.dir)+' · '+esc(c.cp)+' '+esc(barrio(A))+'</p>');
 if(A.nota)h+='<p class="dice">'+esc(A.nota)+'</p>';
 if(A.foto)h+='<img class="fotoc" src="'+A.foto+'" alt="Foto que ha mandado el cliente">';
 h+='<div class="acts"><button class="btn peq" data-a="llamar" data-id="'+A.id+'">'+I.tel+K.telBonito(c.tel)+'</button><a class="btn peq" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.dir.split(',')[0]+', '+c.cp+' '+N.ciudad)+'">'+I.mapa+'Mapa</a>'+(esT?'':'<button class="btn peq" data-a="zona" data-id="'+A.id+'">Su zona</button>')+'</div>';
 return h+'</section>'}
function bGar(A){const G=A.gar0&&el(A.gar0);if(!G)return'';return'<p class="ojo">Puede ser garantía: <a href="#/aviso/'+G.id+'">'+G.id+'</a>, '+esc(cfg.av[G.av].n.toLowerCase())+', terminado el '+K.fechaCorta(K.madrid(G.fin).date)+'.</p>'}
function bReparto(A){const r=K.resumen(S,cfg,Date.now()),rep=['nuevo','asignado','ausente'].includes(A.e);
 /* en una urgencia por repartir: en cuánto llegaría cada uno, y si llegaría tarde a su cita o se saldría de su horario */
 const LL=rep&&!A.cita&&!A.tec?K.llegadas(Object.assign({},S,{avisos:S.avisos.filter(x=>x.id!==A.id)}),cfg,A.cli.dis,Date.now(),A.av):[],ll=id=>LL.find(x=>x.tec===id),pri=LL.find(x=>!x.choca&&!x.fuera);
 const eta=id=>{const x=ll(id);if(!x)return'';return' · llega en ~'+x.llega+' min'+(x.choca?' (y llegaría tarde a su cita)':x.fuera?' (acabaría fuera de su horario)':pri&&pri.tec===id?' · el que antes llega':'')};

const GEO={id:'',w:null,e:'',ult:0,lat:0,lon:0};

 geoPara();GEO.id=A.id;GEO.ult=0;
 if(!navigator.geolocation){GEO.e='sin';return}
 GEO.e='busca';const id=A.id;
 const bien=p=>{if(GEO.id!==id)return;const c=p.coords,ahora=Date.now(),lejos=Math.abs(c.latitude-GEO.lat)+Math.abs(c.longitude-GEO.lon)>.0004;
  if(GEO.e==='ok'&&ahora-GEO.ult<20000&&!lejos)return;
  const r=Oficio.hacer({tipo:'posicion',id,lat:c.latitude,lon:c.longitude},Q);
  if(r.ok){GEO.e='ok';GEO.ult=ahora;GEO.lat=c.latitude;GEO.lon=c.longitude}else if(r.err!=='posicion')geoPara()};
 const mal=e=>{if(GEO.id!==id)return;const antes=GEO.e;GEO.e=e&&e.code===1?'no':GEO.e==='ok'?'ok':'falla';if(GEO.e!==antes&&ruta().v==='aviso')pinta()};

  else if(hacer(Object.assign({tipo:'terminar',id:A.id,firma:pad.vacia()?'':pad.ruta()},T.total?{modo}:{})).ok){d.close();toast(!T.total?'Terminado. Va en su contrato: no se cobra nada.':modo==='pendiente'?'Terminado. Queda por cobrar.':'Terminado y cobrado. Garantía de un año.');location.hash='#/papel/'+A.id+'/parte'}})}

/* ===== los toques ===== */
const ACC={
 menu:()=>hMenu(),
 imprimir:()=>window.print(),
 llamar:A=>hLlamar(A),
 zona:A=>hZona(A),
 msg:(A,b)=>hMsg(A,b.dataset.k),
 completar:A=>hCompletar(A),
 cita:A=>hCita(A),
 cancelar:A=>hCancelar(A),
 cobrar:A=>hCobrar(A),
 facturar:A=>hFacturar(A),
 desfacturar:A=>{if(hacer({tipo:'facturar',id:A.id,quitar:true}).ok)toast('Ya no consta como facturado.')},
 copiaFac:A=>copia(K.datosFactura(cfg,A),'Copiado. Pégalo en tu programa de facturas.'),
 mes:(A,b)=>bajaMes(b.dataset.m),
 ampliar:A=>hPrecio(A,true),
 falta:A=>hFalta(A),
 conAlta:A=>hConAlta(A),
 conCob:(A,b)=>{const C=contrato(b.dataset.c);if(C)hConCob(C)},
 conRen:(A,b)=>{const C=contrato(b.dataset.c);if(C)hConRen(C)},
 conBaja:(A,b)=>{const C=contrato(b.dataset.c);if(C)hConBaja(C)},
 conFac:(A,b)=>{const C=contrato(b.dataset.c);if(C)copia(K.datosFacturaContrato(S,cfg,C,Date.now()),'Copiado. Pégalo en tu programa de facturas.')},
 conRev:(A,b)=>{const C=contrato(b.dataset.c);if(!C)return;Oficio.crear({tipo:'pedir',av:K.REV,origen:'llamada',cli:C.cli},Q).then(r=>{if(!r.ok)return toast(ERR[r.err]||'No se ha podido crear.');toast('Aviso de la revisión creado: dale cita y asígnalo.');location.hash='#/aviso/'+r.id})},
 quitaFalta:(A,b)=>{const k=b.dataset.k,r=hacer(k?{tipo:'falta',id:A.id,k,quitar:true}:{tipo:'falta',id:A.id,t:b.dataset.t,quitar:true});if(r.ok)toast('Quitado de lo que falta.')},
 faltaListo:A=>{if(hacer({tipo:'falta',id:A.id,vaciar:true}).ok)toast('Hecho: ya no falta nada en este aviso.')},
 copiaMat:(A,b)=>{const d=b.dataset.dia||'',g=K.material(S,cfg,d).find(x=>x.tec===(b.dataset.tec||''));if(g)copia(K.textoMaterial(cfg,g,d),'Copiado. Pégalo donde quieras.')},
 asignar:(A,b)=>{const otraVez=A.e==='ausente';if(A.tec===b.dataset.tec&&!otraVez)return;const antes=A.tec&&A.tec!==b.dataset.tec;if(hacer({tipo:'asignar',id:A.id,tec:b.dataset.tec}).ok)toast((otraVez&&!antes?'Vuelve a ir ':antes?'Cambiado: ahora va ':'Asignado a ')+cfg.tec[b.dataset.tec].n+'.'+(A.cita?' Queda escrito el mensaje de la cita.':''))},
 voy:A=>{const r=hacer({tipo:'voy',id:A.id});if(r.ok){toast('De camino. Llegas sobre las '+K.hora(r.eta)+'.');if(ruta().v!=='aviso')location.hash='#/aviso/'+A.id}},
 ausente:A=>{if(hacer({tipo:'ausente',id:A.id}).ok){toast('Apuntado: no había nadie. Vuelve a la centralita.');location.hash='#/hoy'}},
 empezar:A=>hPrecio(A,false),
 terminar:A=>hCierre(A),
 pausa:A=>{const r=hacer({tipo:'pausa',id:A.id});if(r.ok)toast(r.pausa?'En pausa: el tiempo no cuenta.':'Sigue el trabajo.')},
 geoNo:A=>{if(hacer({tipo:'sinPosicion',id:A.id}).ok){geoPara();toast('Ya no se comparte tu posición en este aviso.')}},
 ausencia:(A,b)=>hAusencia(b.dataset.tec||'',b.dataset.dia||''),
 quitaAus:(A,b)=>{const r=Oficio.hacer({tipo:'quitarAusencia',aus:b.dataset.aus},Q);toast(r.ok?'Ausencia quitada. Ya se le puede asignar.':ERR[r.err]||'No se ha podido quitar.')},
 confirma:A=>{if(A.cita&&hacer({tipo:'mover',id:A.id,cita:{dia:A.cita.dia,fr:A.cita.fr},confirmado:true}).ok)toast('Cita confirmada con el cliente.')},
 mCambia:()=>{M.cambia=true;M.codErr='';pinta();const i=$('#m_cod');if(i)i.focus()},
 mCancela:()=>{M.cambia=false;M.codErr='';pinta()},
 mReintenta:()=>{mTrae(true).then(r=>toast(r&&r.ok?(SOP.cola().length?'Todavía no ha salido todo. Se volverá a probar.':'Enviado.'):MERR.red))},
 mOfertas:(A,b)=>{const q=b.dataset.q==='1';b.disabled=true;SOP.ofertas(q).then(r=>{toast(r.ok?(r.sin_ofertas?'Hecho: no verás más ofertas de OOOX.':'Hecho: volverás a ver las ofertas.'):MERR.red);b.disabled=false;mPonListas();const n=$('#mLista [data-a="mOfertas"]');if(n)n.focus({preventScroll:true})})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();S=Oficio.estado();const A=b.dataset.id?el(b.dataset.id):null;if(b.dataset.id&&!A)return toast(ERR.estado);ACC[b.dataset.a](A,b);return}
 const o=e.target.closest('#fNuevo [data-b-av],#fNuevo [data-b-or],#fNuevo [data-b-cu],#fNuevo [data-b-dia],#fNuevo [data-b-fr]');if(o){const x=o.dataset;if(x.bAv)B.av=x.bAv;if(x.bOr)B.or=x.bOr;if(x.bCu)B.cuando=x.bCu;if(x.bDia){B.dia=x.bDia;B.fr=''}if(x.bFr)B.fr=x.bFr;B.err='';pinta()}});
document.addEventListener('input',e=>{const i=e.target;if(i.dataset&&i.dataset.b){B[i.dataset.b]=i.value;
 if(i.dataset.b==='tel'){const t9=K.tel9(i.value),c=t9&&S.avisos.slice().reverse().find(a=>K.tel9(a.cli.tel)===t9);if(c&&!B.nombre&&!B.apellidos&&!B.dir){B.nombre=c.cli.nombre;B.apellidos=c.cli.apellidos||'';B.dir=c.cli.dir;B.cp=c.cli.cp;pinta();const n=$('#n_tel');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}});
document.addEventListener('change',e=>{const i=e.target;
 if(i.dataset&&i.dataset.obs)Oficio.hacer({tipo:'anotar',id:i.dataset.obs,obs:i.value},Q);
 if(i.dataset&&i.dataset.foto&&i.files[0])Oficio.foto(i.files[0]).then(f=>{if(hacer({tipo:'anotar',id:i.dataset.foto,foto:f}).ok)toast('Foto guardada en el parte.')}).catch(()=>toast('No he podido leer esa foto.'))});
document.addEventListener('click',e=>{const t=e.target.closest('#fMejora [data-m-tipo]');if(!t)return;M.tipo=t.dataset.mTipo;if(M.err==='tipo')M.err='';
 $$('#fMejora [data-m-tipo]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mTipo===M.tipo)));const x=$('#e_mtipo');if(x){x.hidden=true;x.closest('.campo').classList.remove('mal')}});
document.addEventListener('input',e=>{const i=e.target;if(i.dataset&&i.dataset.m&&Object.prototype.hasOwnProperty.call(M,i.dataset.m))M[i.dataset.m]=i.value});
document.addEventListener('submit',e=>{const f=e.target.id;if(f==='fMejora'){e.preventDefault();mEnvia()}else if(f==='fCodigo'){e.preventDefault();mCodigo()}else if(f==='fEntra'){e.preventDefault();entra()}});
document.addEventListener('click',e=>{if(!e.target.closest||!e.target.closest('#eVer'))return;EN.ver=!EN.ver;pEntra();$('#e_cod').focus()});
document.addEventListener('input',e=>{if(e.target.id==='e_cod')EN.cod=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='e_quien')EN.quien=e.target.value});
addEventListener('online',()=>{if(SOP&&Q.rol!=='tecnico'&&SOP.cola().length)mTrae(true)});
/* De vez en cuando la centralita mira si OOOX ha contestado algo: como mucho cada media hora, y enseguida si hay algo sin enviar. */
if(SOP){const mira=()=>{if(Q.rol!=='tecnico'&&SOP.codigo()&&(SOP.toca(18e5)||(SOP.cola().length&&navigator.onLine!==false)))mTrae(true)};setTimeout(mira,1500);setInterval(mira,3e5)}
document.addEventListener('submit',e=>{if(e.target.id!=='fNuevo')return;e.preventDefault();
 if(B.cuando==='cita'&&!B.fr){B.err='franja';pinta();return}
 if(B.va)return;B.va=true;const bt=$('#fNuevo [type=submit]');if(bt)bt.disabled=true;
 Oficio.crear({tipo:'pedir',av:B.av,origen:B.or,nota:B.nota,cli:{nombre:B.nombre,apellidos:B.apellidos,tel:B.tel,dir:B.dir,cp:B.cp},cita:B.cuando==='cita'?{dia:B.dia,fr:B.fr}:null},Q).then(r=>{B.va=false;
  if(r.ok){Object.assign(B,{av:N.averias[0].id,or:'llamada',cuando:'urg',fr:'',nombre:'',apellidos:'',tel:'',dir:'',cp:'',nota:'',err:''});toast('Aviso '+r.id+' creado. Ahora, asígnalo.');S=Oficio.estado();if(location.hash==='#/aviso/'+r.id)pinta();else location.hash='#/aviso/'+r.id}
  else{B.err=r.err;pinta();const i=$('#n_'+(r.err==='zona'?'cp':r.err));if(i)i.focus();else toast(ERR[r.err]||'Revisa los datos.')}})});
pinta();
})();
