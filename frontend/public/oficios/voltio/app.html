<!doctype html>
<html lang="es" data-demo data-idioma-fijo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La app por dentro · OOOX Oficios</title>
<meta name="description" content="La app del negocio: los avisos llegan a la oficina, se reparten y el técnico los cierra con tres toques.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14171a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="assets/fuentes/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="oficio.css">
<style>
/* ===== el marco: en el móvil, barra arriba y pestañas abajo; en el ordenador, columna a la izquierda ===== */
body{padding-bottom:calc(64px + var(--sb))}
body.det{padding-bottom:0}
.lado{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--asfalto);border-bottom:1px solid var(--linea)}
/* la marca, de cualquier largo (16-11-2026): en un móvil estrecho encoge un poco y, si aún no cabe, se corta con «…» */
.wm{font:800 clamp(1.25rem,6.6vw,1.5rem)/1 var(--fd);text-decoration:none;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:.12em 0}
.wm span{margin-left:.22em;padding:.02em .22em;border-radius:4px;background:var(--senal);color:var(--negro)}
.quien{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--control);font-weight:600;font-size:.9375rem}
.quien>svg{width:16px;height:16px;color:var(--suave)}
/* en un móvil estrecho, «Tu sesión» se queda en su círculo: su nombre lo dice al tocarlo (y su etiqueta, al lector) */
@media (max-width:374px){.lado .quien>span{display:none}.lado .quien{gap:4px;padding:0 8px 0 5px}}
.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:hsl(var(--h,210) 28% 24%);color:hsl(var(--h,210) 70% 84%);font:700 1.05rem/1 var(--fd);font-style:normal}
.av.c{background:var(--asfalto-3);color:var(--texto)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--asfalto);border-top:1px solid var(--linea);padding-bottom:var(--sb)}
#nav a{position:relative;flex:1;display:grid;justify-items:center;align-content:center;gap:3px;min-height:64px;font-size:.8125rem;font-weight:600;color:var(--suave);text-decoration:none}
#nav a[aria-current]{color:var(--texto)}
#nav a[aria-current]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--senal)}
#nav svg{width:24px;height:24px}
#nav .n{position:absolute;top:8px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--texto);color:var(--negro);font-size:.75rem;line-height:20px;text-align:center}
body.det #nav{display:none}
.lado .demo{display:none}
main{display:block;max-width:720px;margin:0 auto;padding:18px 16px 26px}
main:focus{outline:0}
main.dos{padding:0;max-width:none}
main.dos>.col{padding:18px 16px 26px;max-width:720px;margin:0 auto}
main.dos.det>.lst,main.dos:not(.det)>.sin{display:none}
main.det.tecnico:not(.papelv){display:flex;flex-direction:column;min-height:calc(100svh - 56px)}
main.det.tecnico:not(.papelv)>.accion{margin-top:auto}
main>*:has(+ .accion){margin-bottom:18px}
/* la barra de la ficha de la oficina (auditoría UX-17): el estado y lo principal, pegados abajo */
.accion.of{gap:6px;justify-items:stretch;margin:18px -16px -26px;padding-top:6px;padding-bottom:calc(10px + var(--sb))}
.accion.of .est{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.accion.of .ln{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accion.of .est .txt{flex:none;padding:0 4px}
.accion.of .acs{display:flex;gap:8px}
.accion.of .acs .btn{flex:1 1 auto;min-width:0;padding:4px .7em;white-space:normal;text-align:center;line-height:1.15}
.accion.of .acs .btn.pri{flex-grow:1.6}
/* el aviso corto con botón («Deshacer») */
#toast.on.conb{pointer-events:auto}
#toast .tacc{min-height:44px;margin-left:6px;padding:0 8px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
/* «Por hacer» en dos: «Ahora» y «Después» */
.ph{margin:14px 0 0;font:600 .9375rem/1.2 var(--fb);color:var(--suave)}
.ph:first-child{margin-top:8px}
.phn{margin-top:6px;color:var(--suave)}
/* el mensaje: para quién, por qué, cuándo caduca y lo último que se le mandó */
.mdat{display:grid;gap:6px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;font-size:.9375rem}
.mdat div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px}
.mdat dt{color:var(--suave)}
.mdat dd{margin:0;overflow-wrap:anywhere}

/* ===== título de la pantalla ===== */
.atras{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 2px -6px;padding:0 8px 0 2px;font-weight:600;color:var(--suave);text-decoration:none}
.atras svg{width:20px;height:20px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cab h1,.cab .h1{font:700 1.5rem/1.1 var(--fd)}
.cab .sub{margin-top:5px;color:var(--suave)}
.cab .btn{flex:none}

/* ===== quién está dónde ===== */
.tira{margin-top:10px;border:1px solid var(--linea);border-radius:12px;background:var(--asfalto-2);overflow:hidden}
.tira li{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 14px;font-size:.9375rem}
.tira li+li{border-top:1px solid var(--linea)}
.tira li>span{min-width:0}
.tira small{display:block;font-size:.8125rem;color:var(--suave)}
.tira .on small{color:var(--agua)}
.tira .off small{color:var(--tenue)}

/* ===== listas de avisos ===== */
.sec{margin-top:22px}
.sec>h2,.blq>h2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font:600 .9375rem/1.2 var(--fb);color:var(--suave)}
.sec>h2 .n{color:var(--tenue);font-weight:400}
.lista{display:grid;gap:8px}
.fila{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;min-height:68px;padding:11px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.fila .f1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .f2{grid-column:1;font-size:.9375rem;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .f3{grid-column:1;font-size:.9375rem;font-weight:600;color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .fd{grid-column:2;grid-row:1/3;display:grid;justify-items:end;gap:3px;font-weight:600}
.fila .mini{font-size:.875rem;font-weight:400;color:var(--suave)}
.fila.urg{padding-left:24px}
.fila.urg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:11px 0 0 11px;background:var(--cinta-fina)}
.fila[aria-current]{background:var(--asfalto-3);border-color:var(--control)}
.hueco{padding:14px;border-radius:12px;border:1px dashed var(--control);color:var(--suave);font-size:.9375rem}

/* ===== el aviso por dentro ===== */
.pista{margin-top:18px}
.blq{margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.blq .gr{font-weight:600;font-size:1.125rem}
.blq .dir{font:700 1.5rem/1.15 var(--fd)}
.blq .ln{color:var(--suave)}
.blq .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.blq .cita{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dice{margin-top:12px;padding-left:12px;border-left:3px solid var(--control);color:var(--texto)}
.fotoc{margin-top:12px;width:132px;height:99px;object-fit:cover;border-radius:8px}
.ojo{margin-top:12px;padding:12px 14px 12px 16px;border-radius:12px;background:var(--asfalto-3);color:var(--texto);box-shadow:inset 4px 0 0 var(--control)}
.ojo a{font-weight:600}
.tecs{display:grid;gap:8px}
.tec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border-radius:12px;border:2px solid var(--control)}
.tec small{display:block;font-size:.875rem;color:var(--suave)}
.tec b{font-weight:600}
.tec[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.tec.no{border-style:dashed}
.tec .va{font-size:.875rem;font-weight:600;color:var(--agua)}
.gordo{font:700 2.25rem/1 var(--fd)}
.lins{margin-top:10px}
.lins li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--linea);font-size:.9375rem}
.lins li span:first-child{color:var(--suave)}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msgs li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-top:1px solid var(--linea)}
.msgs li:first-child{border-top:0}
.msgs small{display:block;font-size:.875rem;color:var(--suave)}
.hist{margin-top:12px;padding:0 14px;border-radius:12px;border:1px solid var(--linea)}
.hist summary{min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--suave);cursor:pointer}
.hist ol{padding-bottom:10px}
.hist li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:5px 0;font-size:.9375rem}
.hist time{color:var(--suave)}
.fin{margin-top:16px;text-align:center}
.reloj{display:flex;align-items:center;justify-content:space-between;gap:12px}
.reloj b{font:700 2.5rem/1 var(--fd)}
.reloj small{display:block;font-size:.875rem;color:var(--suave);margin-top:2px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fotos img{width:88px;height:66px;object-fit:cover;border-radius:8px}

/* ===== la acción de la pantalla, siempre al alcance del pulgar ===== */
.accion{position:sticky;bottom:0;z-index:10;display:grid;gap:4px;justify-items:center;margin:auto -16px -26px;padding:12px 16px calc(12px + var(--sb));background:var(--asfalto);border-top:1px solid var(--linea)}
.accion .ln{font-size:.9375rem;color:var(--suave)}

/* ===== hoy, para el técnico ===== */
.sig{position:relative;display:grid;gap:10px;margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--control);background:var(--asfalto-2)}
.sig.urg{padding-top:26px}
.sig.urg::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:13px 13px 0 0;background:var(--cinta-fina)}
.sig .k{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--suave);font-size:.9375rem}
.sig h2{font-size:1.75rem}
.sig .dir{font-weight:600;font-size:1.125rem}

/* ===== agenda ===== */
.dias{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias a{flex:1;display:grid;justify-items:center;align-content:center;gap:1px;min-width:0;min-height:76px;padding:0 4px;border-radius:12px;border:1px solid var(--linea);text-decoration:none;color:var(--suave);font-size:.875rem}
.dias a b{font:700 1.5rem/1 var(--fd);color:var(--texto)}
.dias a small{font-size:.75rem;color:var(--tenue)}
.dias a[aria-current]{background:var(--asfalto-3);border-color:var(--control);color:var(--texto)}
.tabla{display:grid;gap:14px;margin-top:8px}
.sem{display:grid;gap:10px;margin-top:18px}
.semc,.semf{display:grid;grid-template-columns:84px repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.semc span{font-size:.875rem;color:var(--suave)}
.semf{padding-top:10px;border-top:1px solid var(--linea)}
.semd{font-size:.875rem;color:var(--suave)}
.semd b{display:block;font:700 1.5rem/1.1 var(--fd);color:var(--texto)}
.semf [role=cell]{display:grid;gap:6px}
.cch{display:block;padding:9px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.cch b,.cch small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cch b{font-weight:600}
.cch small{font-size:.875rem;color:var(--suave)}
.cch.sin small{color:var(--agua)}
.sem .hueco{padding:9px 12px;font-size:.875rem}
.hueco.of{border-color:var(--senal);color:var(--senal-2)}
/* la capacidad de una franja: una barra y una línea */
.cap{display:grid;gap:6px;margin-top:2px}
.capb{display:flex;gap:3px;height:8px}
.capb i{min-width:6px;border-radius:3px}
.capb .co{background:var(--agua)}
.capb .cl{border:1.5px solid var(--control)}
.capb .cr{background:repeating-linear-gradient(-45deg,var(--senal) 0 4px,var(--asfalto) 4px 7px)}
.capb .cx{background:repeating-linear-gradient(-45deg,var(--control) 0 2px,var(--asfalto) 2px 5px);opacity:.6}
.capt{font-size:.9375rem;color:var(--suave)}
.sem .cap .capt{font-size:.8125rem}
.dlargo{margin-top:14px;font:600 1.0625rem/1.2 var(--fb);color:var(--texto)}
.semd i{display:block;font-style:normal;font-size:.75rem;color:var(--texto)}
/* el resumen de la bandeja */
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.resumen .rs{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;height:100%;min-height:84px;padding:10px 12px 10px 14px;border:1px solid var(--linea);border-radius:12px;background:var(--asfalto-2);color:var(--texto);font:inherit;text-align:left;text-decoration:none;overflow:hidden}
.resumen a.rs:hover,.resumen button.rs:hover{background:var(--asfalto-3)}
.resumen .rs b{font:700 1.875rem/1 var(--fd)}
.resumen .rs span{font-weight:600;font-size:.9375rem;line-height:1.2}
.resumen .rs small{font-size:.8125rem;line-height:1.25;color:var(--suave)}
.resumen .rs.u:not(.cero){padding-left:20px}
.resumen .rs.u:not(.cero)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cinta-fina)}
.resumen .rs.c:not(.cero) b{color:var(--agua)}
.resumen .rs.cero{background:none;border-style:dashed}
.resumen .rs.cero b,.resumen .rs.cero span{color:var(--tenue)}
/* en Cobros, las tres cifras son también las pestañas: la elegida, con borde amarillo */
.resumen.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.resumen.r3 .rs{min-height:78px;padding:10px 10px 10px 12px}
.resumen.r3 .rs b{font-size:1.375rem;white-space:nowrap}
.pest .rs[aria-current]{border-color:var(--senal);box-shadow:inset 0 0 0 1px var(--senal);background:var(--asfalto-3)}
/* Contratos: lo pendiente, en su caja y aparte de la lista */
.dosc .tareas{padding:12px 12px 14px;border-radius:16px;background:var(--asfalto-2);border:1px solid var(--linea)}
.dosc .tareas>h2{color:var(--texto)}
.dosc .tareas .porhacer{background:var(--asfalto)}
.dosc .todos{margin-top:24px}
@media (min-width:1200px){.dosc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}.dosc .tareas{position:sticky;top:20px}.dosc .todos{margin-top:22px}}
.seg a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--suave);text-decoration:none}
.seg a[aria-current]{background:var(--asfalto-3);color:var(--texto)}
.segv{margin-top:14px}
.porhacer{margin-top:10px;border:1px solid var(--linea);border-radius:12px;background:var(--asfalto-2);overflow:hidden}
.porhacer li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:9px 12px 9px 16px}
.porhacer li+li{border-top:1px solid var(--linea)}
.porhacer li>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.porhacer small{font-size:.875rem;color:var(--suave)}
.porhacer small a{color:inherit;font-weight:600}
.porhacer .btn{flex:none}
.porhacer li.atn{box-shadow:inset 4px 0 0 var(--mal)}
button.fila{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.alertas{margin-top:10px;border:1px solid var(--linea);border-radius:12px;background:var(--asfalto-2);overflow:hidden}
.alertas li+li{border-top:1px solid var(--linea)}
.alertas a,.alertas button{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;min-height:54px;padding:9px 40px 9px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.alertas a::after,.alertas button::after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:1.375rem;color:var(--suave)}
.alertas a:hover,.alertas button:hover{background:var(--asfalto-3)}
.alertas b{font-weight:600}
.alertas small{font-size:.875rem;color:var(--suave)}
.alertas li.atn a,.alertas li.atn button{box-shadow:inset 4px 0 0 var(--mal)}
.alertas li.atn b{color:var(--mal)}
.busca{position:relative;margin-top:14px}
.busca svg{position:absolute;left:13px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--suave);pointer-events:none}
.busca input{width:100%;min-height:48px;padding:0 14px 0 42px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2);color:var(--texto);font:inherit}
.busca input::placeholder{color:var(--tenue)}
.mas{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-top:8px;padding:0 16px;border-radius:12px;border:1px dashed var(--control);color:var(--suave);text-decoration:none}
.mas:hover{color:var(--texto);border-color:var(--suave)}
.cdar{position:relative}
.cdar .fila{padding-bottom:62px}
.cdar .dar{position:absolute;left:24px;bottom:12px}
.urgah{margin-top:10px;color:var(--suave);font-size:.9375rem}
.tecds{display:grid;gap:12px;margin-top:14px}
.tecd{padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.tecd>h2{display:flex;align-items:center;gap:10px;font:700 1.25rem/1.1 var(--fd)}
.tecd>.ln{margin-top:6px;color:var(--suave);font-size:.9375rem}
.tecd.aus>.ln{color:var(--mal)}
/* el día de cada técnico en una barra */
.dia{position:relative;height:34px;border-radius:8px;background:repeating-linear-gradient(-45deg,var(--asfalto) 0 5px,var(--asfalto-2) 5px 10px);border:1px solid var(--linea)}
.dia .dt{position:absolute;top:0;bottom:0;background:var(--asfalto-3)}
.dia .dv{position:absolute;top:17px;height:4px;border-radius:2px;background:var(--tenue)}
.dia .dj{position:absolute;top:4px;bottom:4px;min-width:4px;border-radius:5px;background:var(--agua);color:var(--negro);font:600 .8125rem/26px var(--fb);padding:0 6px;overflow:hidden;white-space:nowrap;text-decoration:none;container-type:inline-size}
.dia .dj span{display:block;overflow:hidden;text-overflow:ellipsis}
@container (max-width:50px){.dia .dj span{visibility:hidden}}
.dia .dg{position:absolute;top:0;bottom:0;width:1px;background:var(--linea);opacity:.7}
.dia .dj.u{background:repeating-linear-gradient(-45deg,var(--senal) 0 6px,#e8b400 6px 12px)}
.dia .dj.h{background:var(--bien-f);color:var(--bien);box-shadow:inset 0 0 0 1px var(--bien)}
.dia .dj.n{color:var(--texto);text-shadow:0 0 3px var(--asfalto),0 0 3px var(--asfalto)}
.dia .dx{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;container-type:inline-size}
.dia .dx span{padding:0 5px;border-radius:4px;background:var(--asfalto);color:var(--suave);font:600 .75rem/18px var(--fb);white-space:nowrap}
@container (max-width:72px){.dia .dx span{visibility:hidden}}
.dj.n{background:repeating-linear-gradient(-45deg,var(--control) 0 4px,var(--asfalto) 4px 7px)}
.dia .dj.t{box-shadow:inset 0 0 0 2px var(--mal);background:var(--mal-f);color:var(--mal)}

 if(!Oficio.DEMO)h+='<p class="mpie"><button class="txt" type="button" data-a="mCambia">Cambiar el código de soporte</button></p>';

/* Lo que estaba sin leer al entrar se queda marcado mientras se mira; el número del menú baja a cero. */
function mVisto(){const s=SOP.sinVer();s.nov.forEach(x=>{if(!M.nov.includes(x))M.nov.push(x)});s.pet.forEach(x=>{if(!M.pet.includes(x))M.pet.push(x)});if(s.nov.length||s.pet.length)SOP.marcaVisto()}
function mTrae(fuerza){if(!SOP||!SOP.codigo())return Promise.resolve(null);
 if(mP)return fuerza?mP.then(()=>mTrae(true)):mP;
 if(!fuerza&&!SOP.toca(60000))return Promise.resolve(null);
 M.carga=true;return mP=SOP.buzon().then(r=>{mP=null;M.carga=false;M.sinRed=!r.ok&&r.err==='red';
  const mal=!r.ok&&(r.err==='clave'||r.err==='bloqueo')&&!Oficio.DEMO;if(mal){if(r.err==='clave')SOP.olvidaCodigo();M.cambia=true;M.codErr=r.err}
  if(ruta().v==='mejoras'&&Q.rol!=='tecnico'){if(mal)pinta();else{mVisto();mPonListas()}}
  pNav();return r})}
function mEnvia(){if(M.env)return;const p={tipo:M.tipo,texto:M.texto,quien:M.quien,pantalla:(RASTRO.join(' > ')||'bandeja')+' · '+innerWidth+'×'+innerHeight};
 const e=String(M.texto).trim().length>2000?'largo':SOP.valida(p);
 if(e){M.err=e;pinta();const i=e==='tipo'?$('#fMejora [data-m-tipo]'):$('#m_texto');if(i){i.focus({preventScroll:true});i.closest('.campo').scrollIntoView({block:'center'})}return}
 M.env=true;M.err='';const b=$('#mOk');if(b){b.disabled=true;b.textContent='Enviando…'}
 SOP.enviar(p).then(r=>{M.env=false;
  if(r.ok){M.tipo='';M.texto='';toast(r.enCola?'Sin conexión: queda guardada y saldrá sola.':'Enviada. Te contestamos aquí.')}
  else if(r.err==='clave'&&!Oficio.DEMO){SOP.olvidaCodigo();M.cambia=true;M.codErr='clave';toast(MERR.clave)}
  else toast(MERR[r.err]||MERR.servidor);
  const fin=()=>{if(ruta().v==='mejoras'){pinta();if(r.ok){const i=$('#fMejora [data-m-tipo]');if(i)i.focus({preventScroll:true})}}};

 [0,.2].forEach(s=>{const o=C.createOscillator(),gn=C.createGain(),t=C.currentTime+s;o.frequency.value=880;gn.gain.setValueAtTime(.0001,t);
  gn.gain.exponentialRampToValueAtTime(.3,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(gn).connect(C.destination);o.start(t);o.stop(t+.17)})}catch(e){}}

 const L=Q.rol==='tecnico'?S.avisos.filter(a=>a.tec===Q.id&&(a.e==='asignado'||a.e==='camino')):S.avisos.filter(a=>a.e==='nuevo');

 if(!nuevos.length||!avisarOn())return;

 const pinta=()=>{const T=K.precio(cfg,vivos(),o),mot=$('#rM',d).value.trim().length>=3;
  $('#rL',d).innerHTML=L.map((l,i)=>{const it=cfg.cat[l.k],nom=l.k==='otro'?l.t:it?it.t:l.k;
   return'<li><span class="lt">'+esc(nom)+'<small>'+(l.q>0?(it&&it.un==='h'?OficioPapeles.dur(Math.round(l.q*60)):l.q===1?'1 unidad':l.q+' unidades'):'quitado')+'</small></span><span class="st"><button type="button" data-r="'+i+'" data-m="-1" aria-label="Menos: '+esc(nom)+'"'+(l.q<=0?' disabled':'')+'>−</button><button type="button" data-r="'+i+'" data-m="1" aria-label="Más: '+esc(nom)+'"'+(l.q>=L0[i].q?' disabled':'')+'>+</button></span><b></b></li>'}).join('');
  $('#rT',d).textContent=K.eur(T.total);const b=$('#rOk',d);b.disabled=!(vivos().length&&T.total<A.tot.total&&mot);b.textContent=T.total<A.tot.total?'Rebajar a '+K.eur(T.total):'Rebajar'};

  if(b.dataset.r){const i=+b.dataset.r,l=L[i],m=+b.dataset.m;l.q=Math.max(0,Math.min(L0[i].q,Math.round((l.q+m*paso(l))*100)/100));pinta();const n=$('[data-r="'+i+'"][data-m="'+m+'"]',d);if(n&&!n.disabled)n.focus();return}

 copiaMat:(A,b)=>{const d=b.dataset.dia||'',g=K.material(S,cfg,d).find(x=>x.tec===(b.dataset.tec||''));if(g)copia(K.textoMaterial(cfg,g,d),'Copiado. Pégalo donde quieras.')},
 /* «Asignar a X» y, durante unos segundos, «Deshacer» (auditoría UX-16): vuelve a quien lo llevaba o lo deja sin técnico.
    Después de «No había nadie» no se ofrece: volver a ir es otra visita */
 asignar:(A,b)=>{const otraVez=A.e==='ausente',id=A.id,tec=b.dataset.tec,prev=A.e==='asignado'?A.tec:'';if(A.tec===tec&&!otraVez)return;const antes=A.tec&&A.tec!==tec;
  if(hacer({tipo:'asignar',id,tec}).ok)toast((otraVez&&!antes?'Vuelve a ir ':antes?'Cambiado: ahora va ':'Asignado a ')+cfg.tec[tec].n+'.'+(A.cita?' Queda escrito el mensaje de la cita.':''),otraVez?null:{t:'Deshacer',fn:()=>{const X=el(id),vuelve=prev&&cfg.tec[prev];
   if(!X||X.e!=='asignado'||X.tec!==tec)return toast('Ya no se puede deshacer: el aviso ha cambiado.');
   if(hacer(vuelve?{tipo:'asignar',id,tec:prev}:{tipo:'soltar',id}).ok)toast(vuelve?'Deshecho: lo vuelve a llevar '+cfg.tec[prev].n+'.':'Deshecho: el aviso vuelve a estar sin técnico.')}})},
 voy:A=>{const r=hacer({tipo:'voy',id:A.id});if(r.ok){toast('De camino. Llegas sobre las '+K.hora(r.eta)+'.');if(ruta().v!=='aviso')location.hash='#/aviso/'+A.id}},
 ausente:A=>{if(hacer({tipo:'ausente',id:A.id}).ok){toast('Apuntado: no había nadie. Vuelve a la centralita.');location.hash='#/hoy'}},

 ausencia:(A,b)=>hAusencia(b.dataset.tec||'',b.dataset.dia||''),

 confirma:A=>{if(A.cita&&hacer({tipo:'mover',id:A.id,cita:{dia:A.cita.dia,fr:A.cita.fr},confirmado:true}).ok)toast('Cita confirmada con el cliente.')},
 mCambia:()=>{M.cambia=true;M.codErr='';pinta();const i=$('#m_cod');if(i)i.focus()},

 mOfertas:(A,b)=>{const q=b.dataset.q==='1';b.disabled=true;SOP.ofertas(q).then(r=>{toast(r.ok?(r.sin_ofertas?'Hecho: no verás más ofertas de OOOX.':'Hecho: volverás a ver las ofertas.'):MERR.red);b.disabled=false;mPonListas();const n=$('#mLista [data-a="mOfertas"]');if(n)n.focus({preventScroll:true})})}

/* Los grupos de una sola opción (role=radiogroup) se manejan como los de un formulario de siempre: con Tab se entra
   en el grupo por la opción elegida (o la primera) y con las flechas se pasa de una a otra, eligiéndola. Cada grupo lo
   pinta quien lo use; esto solo pone el orden de tabulación y las flechas, también en las hojas que se abren encima. */
const RADIOS='[role=radiogroup]';
function ronda(g){const R=[...g.querySelectorAll('[role=radio]')],c=R.find(r=>r.getAttribute('aria-checked')==='true'&&!r.disabled)||R.find(r=>!r.disabled);R.forEach(r=>{const v=r===c?0:-1;if(r.tabIndex!==v)r.tabIndex=v})}
new MutationObserver(ms=>{const G=new Set();ms.forEach(m=>{const n=m.target.nodeType===1?m.target:m.target.parentElement;if(!n)return;const g=n.closest&&n.closest(RADIOS);if(g)G.add(g);
 if(m.type==='childList')m.addedNodes.forEach(x=>{if(x.nodeType!==1)return;if(x.matches(RADIOS))G.add(x);x.querySelectorAll(RADIOS).forEach(y=>G.add(y))})});G.forEach(ronda)})
 .observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-checked','disabled']});
document.querySelectorAll(RADIOS).forEach(ronda);
document.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('[role=radio]'),g=r&&r.closest(RADIOS);if(!g)return;
 const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!d&&e.key!==' ')return;e.preventDefault();
 const R=[...g.querySelectorAll('[role=radio]')].filter(x=>!x.disabled);let i=R.indexOf(r);if(d)i=(i+d+R.length)%R.length;const x=R[i];if(!x)return;
 const a=[...x.attributes].find(z=>z.name.startsWith('data-')),sel=a?'['+a.name+'="'+CSS.escape(a.value)+'"]':null,raiz=x.closest('dialog')||document;
 if(x.getAttribute('aria-checked')!=='true')x.click();requestAnimationFrame(()=>{const y=sel&&raiz.querySelector(sel)||x;if(y.isConnected)y.focus()})});
document.addEventListener('submit',e=>{if(e.target.id!=='fNuevo')return;e.preventDefault();
 if(!B.av||!cfg.av[B.av]){B.err='av';pinta();const x=$('#fNuevo [data-b-av]');if(x)x.focus();return}
 if(B.cuando!=='urg'&&B.cuando!=='cita'){B.err='cuando';pinta();const x=$('#fNuevo [data-b-cu]');if(x)x.focus();return}
 if(B.cuando==='cita'&&!B.fr){B.err='franja';pinta();return}
 if(B.va)return;B.va=true;const bt=$('#fNuevo [type=submit]');if(bt)bt.disabled=true;
 const pn=K.parteNombre(B.nomap);Oficio.crear({tipo:'pedir',av:B.av,origen:B.or,nota:B.nota,cli:{nombre:pn.nombre,apellidos:pn.apellidos,tel:B.tel,dir:B.dir,cp:B.cp},cita:B.cuando==='cita'?{dia:B.dia,fr:B.fr}:null},Q).then(r=>{B.va=false;
  if(r.ok){Object.assign(B,{av:'',or:'llamada',cuando:'',fr:'',nomap:'',tel:'',dir:'',cp:'',nota:'',err:''});toast('Aviso '+r.id+' creado. Ahora, asígnalo.');S=Oficio.estado();if(location.hash==='#/aviso/'+r.id)pinta();else location.hash='#/aviso/'+r.id}
  else{B.err=r.err==='nombre'||r.err==='apellidos'?'nomap':r.err;pinta();const i=$('#n_'+(r.err==='zona'?'cp':B.err));if(i)i.focus();else toast(ERR[r.err]||'Revisa los datos.')}})});
pinta();
