<!doctype html>
<html lang="es" data-demo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ramírez 24 h por dentro · demo de OOOX Oficios</title>
<meta name="description" content="La app de gestión de un fontanero, de ejemplo: los avisos llegan a la centralita, se reparten y el técnico los cierra con tres toques.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="assets/fuentes/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="oficio.css">
<style>
/* ===== el marco: en el móvil, barra arriba y pestañas abajo; en el ordenador, columna a la izquierda ===== */
body{padding-bottom:calc(64px + var(--sb))}
body.det{padding-bottom:0}
.lado{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--asfalto);border-bottom:1px solid var(--linea)}
.wm{font:800 1.5rem/1 var(--fd);text-decoration:none;white-space:nowrap}
.wm span{margin-left:.22em;padding:.02em .22em;border-radius:4px;background:var(--senal);color:var(--negro)}
.quien{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--control);font-weight:600;font-size:.9375rem}
.quien>svg{width:16px;height:16px;color:var(--suave)}
.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:hsl(var(--h,210) 28% 24%);color:hsl(var(--h,210) 70% 84%);font:700 1.05rem/1 var(--fd);font-style:normal}
.av.c{background:var(--asfalto-3);color:var(--texto)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--asfalto);border-top:1px solid var(--linea);padding-bottom:var(--sb)}
#nav a{position:relative;flex:1;display:grid;justify-items:center;align-content:center;gap:3px;min-height:64px;font-size:.8125rem;font-weight:600;color:var(--suave);text-decoration:none}
#nav a[aria-current]{color:var(--texto)}
#nav a[aria-current]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--senal)}
#nav svg{width:24px;height:24px}
#nav .n{position:absolute;top:8px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--senal);color:var(--negro);font-size:.75rem;line-height:20px;text-align:center}
body.det #nav{display:none}
.lado .demo{display:none}
main{display:block;max-width:720px;margin:0 auto;padding:18px 16px 26px}
main:focus{outline:0}
main.dos{padding:0;max-width:none}
main.dos>.col{padding:18px 16px 26px;max-width:720px;margin:0 auto}
main.dos.det>.lst,main.dos:not(.det)>.sin{display:none}
main.det.tecnico:not(.papelv){display:flex;flex-direction:column;min-height:calc(100svh - 56px)}
main.det.tecnico:not(.papelv)>.accion{margin-top:auto}
main>*:has(+ .accion){margin-bottom:18px}

/* ===== título de la pantalla ===== */
.atras{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 2px -6px;padding:0 8px 0 2px;font-weight:600;color:var(--suave);text-decoration:none}
.atras svg{width:20px;height:20px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cab h1,.cab .h1{font:700 1.5rem/1.1 var(--fd)}
.cab .sub{margin-top:5px;color:var(--suave)}
.cab .btn{flex:none}

/* ===== quién está dónde ===== */
.tira{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.tira li{display:flex;align-items:center;gap:8px;flex:none;min-height:46px;padding:5px 14px 5px 6px;border-radius:999px;border:1px solid var(--linea);font-size:.9375rem;white-space:nowrap}
.tira small{display:block;font-size:.8125rem;color:var(--suave)}
.tira .on small{color:var(--agua)}

/* ===== listas de avisos ===== */
.sec{margin-top:22px}
.sec>h2,.blq>h2{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font:600 .9375rem/1.2 var(--fb);color:var(--suave)}
.sec>h2 .n{color:var(--tenue);font-weight:400}
.lista{display:grid;gap:8px}
.fila{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;min-height:68px;padding:11px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.fila .f1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .f2{grid-column:1;font-size:.9375rem;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .fd{grid-column:2;grid-row:1/3;display:grid;justify-items:end;gap:3px;font-weight:600}
.fila .mini{font-size:.875rem;font-weight:400;color:var(--suave)}
.fila.urg{padding-left:24px}
.fila.urg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:11px 0 0 11px;background:var(--cinta-fina)}
.fila[aria-current]{background:var(--asfalto-3);border-color:var(--control)}
.hueco{padding:14px;border-radius:12px;border:1px dashed var(--control);color:var(--suave);font-size:.9375rem}

/* ===== el aviso por dentro ===== */
.pista{margin-top:18px}
.blq{margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.blq .gr{font-weight:600;font-size:1.125rem}
.blq .dir{font:700 1.5rem/1.15 var(--fd)}
.blq .ln{color:var(--suave)}
.blq .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.blq .cita{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dice{margin-top:12px;padding-left:12px;border-left:3px solid var(--control);color:var(--texto)}
.fotoc{margin-top:12px;width:132px;height:99px;object-fit:cover;border-radius:8px}
.ojo{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--aviso-f);color:var(--senal-2)}
.ojo a{font-weight:600}
.tecs{display:grid;gap:8px}
.tec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border-radius:12px;border:2px solid var(--control)}
.tec small{display:block;font-size:.875rem;color:var(--suave)}
.tec b{font-weight:600}
.tec[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.tec .va{font-size:.875rem;font-weight:600;color:var(--senal-2)}
.gordo{font:700 2.25rem/1 var(--fd)}
.lins{margin-top:10px}
.lins li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--linea);font-size:.9375rem}
.lins li span:first-child{color:var(--suave)}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msgs li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:4px 0;border-top:1px solid var(--linea)}
.msgs li:first-child{border-top:0}
.msgs small{display:block;font-size:.875rem;color:var(--suave)}
.hist{margin-top:12px;padding:0 14px;border-radius:12px;border:1px solid var(--linea)}
.hist summary{min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--suave);cursor:pointer}
.hist ol{padding-bottom:10px}
.hist li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:5px 0;font-size:.9375rem}
.hist time{color:var(--suave)}
.fin{margin-top:16px;text-align:center}
.reloj{display:flex;align-items:center;justify-content:space-between;gap:12px}
.reloj b{font:700 2.5rem/1 var(--fd)}
.reloj small{display:block;font-size:.875rem;color:var(--suave);margin-top:2px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fotos img{width:88px;height:66px;object-fit:cover;border-radius:8px}

/* ===== la acción de la pantalla, siempre al alcance del pulgar ===== */
.accion{position:sticky;bottom:0;z-index:10;display:grid;gap:4px;justify-items:center;margin:auto -16px -26px;padding:12px 16px calc(12px + var(--sb));background:var(--asfalto);border-top:1px solid var(--linea)}
.accion .ln{font-size:.9375rem;color:var(--suave)}

/* ===== hoy, para el técnico ===== */
.sig{position:relative;display:grid;gap:10px;margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--control);background:var(--asfalto-2)}
.sig.urg{padding-top:26px}
.sig.urg::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:13px 13px 0 0;background:var(--cinta-fina)}
.sig .k{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--suave);font-size:.9375rem}
.sig h2{font-size:1.75rem}
.sig .dir{font-weight:600;font-size:1.125rem}

/* ===== agenda ===== */
.dias{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias a{flex:1;display:grid;justify-items:center;align-content:center;gap:1px;min-width:0;min-height:76px;padding:0 4px;border-radius:12px;border:1px solid var(--linea);text-decoration:none;color:var(--suave);font-size:.875rem}
.dias a b{font:700 1.5rem/1 var(--fd);color:var(--texto)}
.dias a small{font-size:.75rem;color:var(--tenue)}
.dias a[aria-current]{background:var(--asfalto-3);border-color:var(--control);color:var(--texto)}
.tabla{display:grid;gap:14px;margin-top:8px}
.sem{display:grid;gap:10px;margin-top:18px}
.semc,.semf{display:grid;grid-template-columns:84px repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.semc span{font-size:.875rem;color:var(--suave)}
.semf{padding-top:10px;border-top:1px solid var(--linea)}
.semd{font-size:.875rem;color:var(--suave)}
.semd b{display:block;font:700 1.5rem/1.1 var(--fd);color:var(--texto)}
.semf [role=cell]{display:grid;gap:6px}
.cch{display:block;padding:9px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--asfalto-2);text-decoration:none}
.cch b,.cch small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cch b{font-weight:600}
.cch small{font-size:.875rem;color:var(--suave)}
.cch.sin small{color:var(--senal-2)}
.sem .hueco{padding:9px 12px;font-size:.875rem}
.fr>h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 8px;font:700 1.25rem/1 var(--fd)}
.fr>h3 small{font:400 .875rem/1 var(--fb);color:var(--suave)}

/* ===== cobros ===== */
.cifras{display:grid;grid-template-columns:repeat(2,1fr);margin-top:8px;border-radius:12px;border:1px solid var(--linea);background:var(--asfalto-2)}
.cifras div{padding:12px 14px;border-top:1px solid var(--linea)}
.cifras div:nth-child(-n+2){border-top:0}
.cifras div:nth-child(even){border-left:1px solid var(--linea)}
.cifras dt{font-size:.875rem;color:var(--suave)}
.cifras dd{font:700 1.5rem/1.1 var(--fd);margin-top:2px}

/* ===== formularios ===== */
.form{display:grid;gap:16px;margin-top:16px}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{min-height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--control);font-weight:600}
.op small{font-weight:400;color:var(--suave);margin-left:4px}
.op[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.op[disabled]{border-style:dashed;color:var(--tenue);cursor:not-allowed}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--asfalto-2);border:1px solid var(--linea)}
.seg button{min-height:44px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--suave)}
.seg button[aria-pressed=true]{background:var(--asfalto-3);color:var(--texto)}
.duo{display:grid;grid-template-columns:1fr 120px;gap:12px}
.lb{font-size:.9375rem;font-weight:600}
.hoja .ops .op{border-color:var(--control)}
.hoja.papel .op{border-color:#aeb4ba}
.hoja.papel .op small{color:var(--tinta-2)}
.hoja.papel .op[aria-pressed=true]{border-color:var(--tinta);background:var(--papel-2)}
.hoja.papel .op[disabled]{color:#70777e}

/* ===== el precio que firma el cliente (papel) ===== */
.hoja .dn{font-size:.9375rem;color:var(--suave)}
.hoja.papel .dn{color:var(--tinta-2)}
.tar{font-weight:600}
.plin li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--raya)}
.plin .lt small{display:block;font-size:.875rem;color:var(--tinta-2)}
.plin b{font-weight:600;min-width:76px;text-align:right}
.st{display:flex;gap:6px}
.st button{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;border:2px solid #aeb4ba;font-size:1.4rem;font-weight:600;line-height:1}
.st button[disabled]{color:#aeb4ba;border-color:var(--raya);cursor:not-allowed}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--tinta)}
.ptot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:10px;border-top:2px solid var(--tinta);font:800 2.25rem/1 var(--fd)}
.hoja .iva{font-size:.9375rem;color:var(--tinta-2);text-align:right;margin-top:-8px}
.sube{padding:10px 12px;border-radius:10px;background:#fff3c4;color:#4d3b00;font-weight:600}
.firma{display:grid;gap:6px}
.firma .fh{display:flex;justify-content:space-between;align-items:center}
.firma canvas{width:100%;height:150px;border-radius:10px;border:2px dashed #aeb4ba;background:#fff}
.otro{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}

/* ===== papeles en pantalla ===== */
main.papelv{max-width:760px}
.vdocs{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto}
.vdocs a{flex:none;display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--linea);text-decoration:none;font-weight:600;color:var(--suave)}
.vdocs a[aria-current]{background:var(--asfalto-3);border-color:var(--control);color:var(--texto)}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ===== el menú de la demo ===== */
.mrol{display:grid;gap:8px}
.mnota{font-size:.9375rem;color:var(--suave)}

@media (min-width:960px){
 body{padding-bottom:0}
 .marco{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100svh}
 .lado{position:sticky;top:0;height:100svh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:16px;padding:22px 14px 18px;border-bottom:0;border-right:1px solid var(--linea)}
 .wm{padding:0 8px;font-size:1.75rem}
 .quien{justify-content:flex-start;border-radius:12px;padding:6px 10px 6px 8px}
 .quien>svg{margin-left:auto}
 #nav{position:static;flex-direction:column;gap:2px;padding:0;border:0;background:none}
 #nav a{display:flex;justify-items:start;align-content:normal;align-items:center;gap:12px;flex:none;min-height:46px;padding:0 12px;border-radius:10px;font-size:1rem}
 #nav a[aria-current]{background:var(--asfalto-3)}
 #nav a[aria-current]::before{display:none}
 #nav .n{position:static;margin-left:auto}
 body.det #nav{display:flex}
 .lado .demo{display:block;margin-top:auto;padding:0 8px;font-size:.875rem;color:var(--tenue)}
 .cab h1,.cab .h1{font-size:1.75rem}
 main{margin:0;max-width:1240px;padding:30px 36px 40px}
 main.estrecha{max-width:760px;margin:0 auto}
 .cifras{grid-template-columns:repeat(4,1fr)}
 .cifras div{border-top:0}
 .cifras div+div{border-left:1px solid var(--linea)}
 main.tecnico{max-width:600px;margin:0 auto}
 main.dos{display:grid;grid-template-columns:minmax(380px,1fr) minmax(0,1.5fr);max-width:none}
 main.dos>.col{max-width:none;margin:0;height:100svh;overflow-y:auto;padding:30px 28px 40px}
 main.dos>.col+.col{border-left:1px solid var(--linea)}
 main.dos.det>.lst,main.dos:not(.det)>.sin{display:block}
 main.dos .atras{display:none}
 main.tecnico .accion{margin:auto -36px -40px;padding:14px 36px}
 main.det.tecnico:not(.papelv){min-height:100svh}
 .tabla{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.solo body{padding:0}
.solo .lado,.solo .noimp,.solo #toast{display:none}
.solo main{max-width:none;margin:0;padding:0}
.solo .doc{max-width:none;border-radius:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="vh" href="#v">Saltar al contenido</a>
<div class="marco">
 <header class="lado">
  <a class="wm" href="#/" aria-label="Ramírez 24 h: inicio de la app">Ramírez<span>24 h</span></a>
  <div id="quien"></div>
  <nav id="nav" aria-label="Secciones"></nav>
  <p class="demo">Demo de OOOX Oficios. Todo es de ejemplo y se queda en este navegador.</p>
 </header>
 <main id="v" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/oficio-nucleo.js"></script>
<script src="js/oficio-datos.js"></script>
<script src="js/oficio-estado.js"></script>
<script>
(function(){
'use strict';
const {K,N,cfg}=Oficio,$=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),FIJO=P.has('fijo');
if(P.has('solo'))document.documentElement.classList.add('solo');
let Q=P.get('papel')==='tecnico'?{rol:'tecnico',id:cfg.tec[P.get('tec')]?P.get('tec'):'omar'}:{rol:'centralita',id:'marta'};
let S=Oficio.estado();
const pro=()=>(S.pack||cfg.pack)!=='basico';
const sv=(d,x)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(x||'')+'>'+d+'</svg>';
const I={mas:sv('<path d="M12 5v14M5 12h14"/>'),atras:sv('<path d="M15 5l-7 7 7 7"/>'),x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),baja:sv('<path d="M6 9l6 6 6-6"/>'),
 tel:sv('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),mapa:sv('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.800-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
 bandeja:sv('<path d="M4 13l2-8h12l2 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h5l1 2h4l1-2h5"/>'),agenda:sv('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'),
 euro:sv('<path d="M17 7a6 6 0 1 0 0 10M5 10h8M5 14h8"/>'),hoy:sv('<path d="M5 6h14M5 12h14M5 18h9"/>'),hecho:sv('<path d="M5 12.5l4.500 4.500L19 7"/>')};
const hace=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'ahora mismo':m<60?'hace '+m+' min':m<1440?'hace '+Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):'hace '+Math.floor(m/1440)+' d'};
const dur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');
const frTxt=id=>{const f=cfg.franjas.find(x=>x.id===id);return f?'de '+f.de/60+' a '+f.a/60:''};
const D3=['dom','lun','mar','mié','jue','vie','sáb'];
const diaTxt=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':'el '+K.fechaLarga(f)};
const diaCorto=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':D3[new Date(f+'T12:00:00Z').getUTCDay()]+' '+(+f.slice(8))};
const cuandoT=t=>{const f=K.madrid(t).date,h=K.madrid().date;return(f===h?'':f===K.masDias(h,-1)?'ayer, ':K.fechaCorta(f)+', ')+K.hora(t)};
const barrio=A=>A.cli.dis?cfg.zonas.dis[A.cli.dis][0]:'';
const ORIG={llamada:'por teléfono',web:'desde la web',cita:'cita en la web'};

 const d=hoja(hc(A.cita?'Cambiar la cita':'Dar cita')+'<div class="hb" id="cB"></div><div class="hp"><button class="btn pri ancho" id="cOk">Guardar la cita</button>'+(A.cita?'<button class="txt" id="cUr" style="justify-self:center">Pasar a urgente</button>':'')+'</div>');
 const p=()=>{const dias=K.diasDe(S,cfg,Date.now(),6);if(!dias.find(x=>x.dia===dia))dia=dias[0].dia;const F=K.franjasDe(S,cfg,dia,Date.now(),A.id);
  $('#cB',d).innerHTML='<div class="campo"><span class="lb">Día</span><div class="ops">'+dias.map(x=>'<button class="op" data-d="'+x.dia+'" aria-pressed="'+(x.dia===dia)+'">'+diaCorto(x.dia)+'</button>').join('')+'</div></div><div class="campo"><span class="lb">Franja</span><div class="ops">'+F.map(f=>'<button class="op" data-f="'+f.id+'" aria-pressed="'+(f.id===fr)+'"'+(f.ok?'':' disabled')+'>'+f.txt+'<small>'+(f.ok?(f.libres===1?'queda 1':'quedan '+f.libres):f.libres?'ya no da tiempo':'llena')+'</small></button>').join('')+'</div></div><p class="dn">Con cita, la tarifa es siempre la normal.</p>'};
 p();d.addEventListener('click',e=>{const b=e.target.closest('[data-d],[data-f],#cOk,#cUr');if(!b)return;
  if(b.dataset.d){dia=b.dataset.d;fr='';p()}else if(b.dataset.f){fr=b.dataset.f;p()}
  else if(b.id==='cUr'){if(hacer({tipo:'mover',id:A.id,cita:null}).ok){d.close();toast('Pasa a urgente.')}}
  else{if(!fr)return toast('Elige una franja.');if(hacer({tipo:'mover',id:A.id,cita:{dia,fr}}).ok){d.close();toast('Cita guardada: '+diaCorto(dia)+', '+frTxt(fr)+'.')}}})}
function hCompletar(A){const c=A.cli;
 const d=hoja(hc('Datos del cliente')+'<form class="hb" id="kF" novalidate><p class="dn">Cópialos de su WhatsApp. Solo se escriben una vez.</p>'+[['tel','Teléfono',c.tel,'type="tel" inputmode="tel"'],['nombre','Nombre',c.nombre,''],['dir','Calle, número y piso',c.dir,''],['cp','Código postal',c.cp,'inputmode="numeric" maxlength="5"']].map(x=>'<div class="campo"><label for="k_'+x[0]+'">'+x[1]+'</label><input id="k_'+x[0]+'" name="'+x[0]+'" value="'+esc(x[2])+'" autocomplete="off" '+x[3]+'><p class="err" hidden></p></div>').join('')+'</form><div class="hp"><button class="btn pri ancho" form="kF">Guardar</button></div>');
 $('#kF',d).onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r=Oficio.hacer({tipo:'completar',id:A.id,cli:{tel:f.get('tel'),nombre:f.get('nombre'),dir:f.get('dir'),cp:f.get('cp')}},Q);
  $$('.campo',d).forEach(x=>{x.classList.remove('mal');$('.err',x).hidden=true});
  if(r.ok){d.close();toast('Datos guardados. Ya se puede repartir.');return}
  const k=r.err==='zona'?'cp':r.err,i=$('#k_'+k,d);if(i){const x=i.closest('.campo');x.classList.add('mal');const m=$('.err',x);m.textContent=ERR[r.err];m.hidden=false;i.focus()}else toast(ERR[r.err]||'No se ha podido guardar.')}}
function hCancelar(A){const d=hoja(hc('¿Cancelar el aviso?')+'<div class="hb"><p>'+A.id+', '+esc(cfg.av[A.av].n.toLowerCase())+(A.cli.nombre?' de '+esc(A.cli.nombre):'')+'. Sale de la bandeja y, si tenía cita, su hueco queda libre. No se puede deshacer.</p></div><div class="hp"><button class="btn ancho" id="xOk" style="border-color:var(--mal);color:var(--mal)">Cancelar el aviso</button><button class="btn ancho" data-x>Volver</button></div>');
 $('#xOk',d).onclick=()=>{if(hacer({tipo:'cancelar',id:A.id}).ok){d.close();toast('Aviso cancelado.');location.hash='#/bandeja'}}}
const modos=(L,sel)=>'<div class="ops" role="group" aria-label="Cómo paga">'+L.map(k=>'<button type="button" class="op" data-modo="'+k+'" aria-pressed="'+(sel===k)+'">'+PAGO[k]+'</button>').join('')+'</div>';
function hCobrar(A){let modo='';const d=hoja(hc('Marcar como cobrado')+'<div class="hb"><p>'+A.id+' · '+esc(A.cli.nombre)+' · <b class="num">'+K.eur(A.tot.total)+'</b></p><div id="oM">'+modos(['transferencia','bizum','efectivo','tarjeta'],'')+'</div></div><div class="hp"><button class="btn pri ancho" id="oOk" disabled>Cobrado</button></div>');
 d.addEventListener('click',e=>{const b=e.target.closest('[data-modo],#oOk');if(!b)return;if(b.dataset.modo){modo=b.dataset.modo;$('#oM',d).innerHTML=modos(['transferencia','bizum','efectivo','tarjeta'],modo);$('#oOk',d).disabled=false}
  else if(hacer({tipo:'cobrar',id:A.id,modo}).ok){d.close();toast('Cobrado: '+K.eur(A.tot.total)+'.')}})}

/* el presupuesto que firma el cliente y, con otra forma, la ampliación */
function hPrecio(A,ampliar){const av=cfg.av[A.av],urg=ampliar?A.tot.urg:K.tarifaDe(cfg,A);
 let lin=ampliar?[]:av.ini.map(l=>({k:l.k,q:l.q||cfg.cat[l.k].min})),local=ampliar?A.local:false,pad,otro=false;
 const base=ampliar?A.lin.map(l=>Object.assign({},l)):[],hayMo=base.some(l=>l.k==='mo'),minMo=ampliar?(hayMo?.25:1):1;
 const junto=()=>{const J=base.map(l=>Object.assign({},l));lin.forEach(l=>{const ya=l.k!=='otro'&&J.find(x=>x.k===l.k);if(ya)ya.q+=l.q;else J.push(Object.assign({},l))});return J};
 const d=hoja(hc(ampliar?'Añadir al trabajo':'Presupuesto')+'<div class="hb"><p class="dn">'+A.id+' · '+esc(av.n)+' · '+esc(A.cli.dir)+'</p>'+
  (ampliar?'<p class="tar">Presupuesto firmado: '+K.eur(A.tot.total)+'. Lo que añadas aquí se firma aparte.</p>':'<p class="tar">'+(urg?'Tarifa de urgencia: un 40 % más en desplazamiento y mano de obra. El aviso entró '+cuandoT(A.t)+'.':'Tarifa normal.')+'</p>')+
  '<ul class="plin" id="pL"></ul><div class="campo"><span class="lb">Añadir</span><div class="ops" id="pC"></div><div id="pO"></div></div>'+
  (ampliar?'':'<label class="chk"><input type="checkbox" id="pLoc"> Es un local o una vivienda de menos de dos años</label>')+'<div id="pT" style="display:grid;gap:14px"></div>'+
  '<div class="firma"><div class="fh"><span class="lb">Firma del cliente</span><button class="txt" id="pB" type="button">Borrar</button></div><canvas id="pF" aria-label="Zona para firmar con el dedo"></canvas></div>'+
  '<p class="dn">'+(ampliar?'Solo se hace si el cliente lo firma antes.':'Precio cerrado. Si hace falta algo más, te lo decimos antes y lo firmas.')+'</p></div>'+
  '<div class="hp"><button class="btn pri ancho" id="pOk" disabled>'+(ampliar?'Firmado: añadir':'Firmado: empezar')+'</button>'+(ampliar?'':'<button class="txt mal" id="pNo" type="button" style="justify-self:center">No acepta el precio</button>')+'</div>',{papel:1,llena:1,fijo:1});
 const listo=()=>{$('#pOk',d).disabled=!pad||pad.vacia()||!lin.length};
 const p=cambia=>{const T=K.precio(cfg,junto(),{urg,local}),solo=K.precio(cfg,lin,{urg,tipo:T.tipo,sinMin:ampliar&&hayMo});
  $('#pL',d).innerHTML=solo.lineas.map((l,i)=>{const it=cfg.cat[l.k],fijo=!ampliar&&!l.mat&&l.un!=='h';
   return'<li><span class="lt">'+esc(l.t)+(lq(l)||l.u?'<small>'+[lq(l),l.u?'con el 40 % de urgencia':''].filter(Boolean).join(' · ')+'</small>':'')+'</span>'+
    (l.un==='h'?'<span class="st"><button type="button" data-q="'+i+'" data-m="-1" aria-label="Quitar un cuarto de hora"'+(l.q<=minMo?' disabled':'')+'>−</button><button type="button" data-q="'+i+'" data-m="1" aria-label="Añadir un cuarto de hora">+</button></span>':fijo?'<span></span>':'<span class="st"><button type="button" data-del="'+i+'" aria-label="Quitar '+esc(l.t)+'">×</button></span>')+'<b class="num">'+K.eur(l.imp)+'</b></li>'}).join('')||'<li><span class="lt" style="color:var(--tinta-2)">Todavía no has añadido nada.</span><span></span><b></b></li>';
  const ya=new Set(lin.map(l=>l.k)),C=(ampliar?['mo']:[]).concat(av.chips).filter(k=>!ya.has(k));
  $('#pC',d).innerHTML=C.map(k=>'<button type="button" class="op" data-add="'+k+'">'+esc(k==='mo'?'Más tiempo':cfg.cat[k].t)+'<small>'+K.eur(k==='mo'?red4(cfg.cat.mo,T.tipo,urg)*(hayMo?1:4):precioDe(k,T.tipo))+'</small></button>').join('')+'<button type="button" class="op" data-otro>Otro material</button>';
  $('#pO',d).innerHTML=otro?'<div class="otro" style="margin-top:10px"><div class="campo"><label for="oT">Qué es</label><input id="oT" maxlength="60"></div><div class="campo"><label for="oP">Precio, €</label><input id="oP" inputmode="decimal"></div><button type="button" class="btn peq" id="oOk">Añadir</button></div>':'';
  $('#pT',d).innerHTML='<div class="ptot"><span>'+(ampliar?'Total nuevo':'Total')+'</span><span class="num">'+K.eur(T.total)+'</span></div><p class="iva">'+(ampliar&&lin.length?K.eur(T.total-A.tot.total)+' más. ':'')+'IVA del '+T.tipo+' % incluido: base '+K.eur(T.base)+' + IVA '+K.eur(T.iva)+'</p>'+
   (T.motivo==='material'?'<p class="sube">El material pasa del 40 % del trabajo: Hacienda pide el IVA del 21 % en todo el trabajo.</p>':'');
  if(cambia&&pad&&!pad.vacia()){pad.borrar();toast('Ha cambiado el precio: hay que firmar otra vez.')}listo()};
 const precioDe=(k,tipo)=>{const it=cfg.cat[k];return tipo===21?it.p21:it.p10},red4=(it,tipo,u)=>Math.round((tipo===21?it.p21:it.p10)*.25*(u?1+cfg.recargo:1));
 p(false);pad=Oficio.firma($('#pF',d),listo);
 $('#pB',d).onclick=()=>pad.borrar();
 const loc=$('#pLoc',d);if(loc)loc.onchange=()=>{local=loc.checked;p(true)};
 d.addEventListener('click',e=>{const b=e.target.closest('[data-q],[data-del],[data-add],[data-otro],#oOk,#pOk,#pNo');if(!b)return;
  if(b.dataset.q!=null){const l=lin[+b.dataset.q];l.q=Math.max(minMo,l.q+ +b.dataset.m*.25);p(true)}
  else if(b.dataset.del!=null){lin.splice(+b.dataset.del,1);p(true)}
  else if(b.dataset.add){lin.push({k:b.dataset.add,q:b.dataset.add==='mo'?minMo:1});p(true)}
  else if('otro'in b.dataset){otro=!otro;p(false);if(otro)$('#oT',d).focus()}
  else if(b.id==='oOk'){const t=$('#oT',d).value.trim(),v=parseFloat($('#oP',d).value.replace(',','.'));if(!t||!(v>0))return toast('Escribe qué es y cuánto cuesta.');lin.push({k:'otro',t,p:Math.round(v*100)/100,q:1});otro=false;p(true)}
  else if(b.id==='pNo'){d.close();hNoAcepta(A,local)}
  else if(b.id==='pOk'){const r=ampliar?hacer({tipo:'ampliar',id:A.id,lineas:lin,firma:pad.ruta()}):hacer({tipo:'empezar',id:A.id,pres:{lineas:lin,local,firma:pad.ruta()}});
   if(r.ok){d.close();toast(ampliar?'Ampliación firmada: '+K.eur(r.dif)+' más.':'Presupuesto firmado. Empieza el trabajo.')}}})}
function hNoAcepta(A,local){let modo='';const T=K.precio(cfg,[{k:N.sinTrabajo,q:1}],{urg:K.tarifaDe(cfg,A),local});
 const d=hoja(hc('No acepta el precio')+'<div class="hb"><p>Se cobra solo el desplazamiento.</p><div class="ptot"><span>Total</span><span class="num">'+K.eur(T.total)+'</span></div><p class="iva">IVA del '+T.tipo+' % incluido'+(T.urg?' · tarifa de urgencia':'')+'</p><div class="campo"><span class="lb">¿Cómo paga?</span><div id="nM">'+modos(['efectivo','tarjeta','bizum','pendiente'],'')+'</div></div></div><div class="hp"><button class="btn pri ancho" id="nOk" disabled>Cerrar el aviso</button></div>',{papel:1,fijo:1});
 d.addEventListener('click',e=>{const b=e.target.closest('[data-modo],#nOk');if(!b)return;if(b.dataset.modo){modo=b.dataset.modo;$('#nM',d).innerHTML=modos(['efectivo','tarjeta','bizum','pendiente'],modo);$('#nOk',d).disabled=false}
  else if(hacer({tipo:'noacepta',id:A.id,modo,local}).ok){d.close();toast('Aviso cerrado: solo el desplazamiento.')}})}
function hCierre(A){let modo='',pad;const T=A.tot;
 const d=hoja(hc('Trabajo terminado')+'<div class="hb"><p class="dn">'+A.id+' · '+esc(cfg.av[A.av].n)+' · '+dur(K.minutos(A,Date.now()))+' de trabajo</p><ul class="plin">'+T.lineas.map(l=>'<li><span class="lt">'+esc(l.t)+(lq(l)?'<small>'+lq(l)+'</small>':'')+'</span><span></span><b class="num">'+K.eur(l.imp)+'</b></li>').join('')+'</ul>'+
  '<div class="ptot"><span>Total</span><span class="num">'+K.eur(T.total)+'</span></div><p class="iva">IVA del '+T.tipo+' % incluido: base '+K.eur(T.base)+' + IVA '+K.eur(T.iva)+'</p>'+
  '<div class="campo"><span class="lb">¿Cómo paga?</span><div id="tM">'+modos(['efectivo','tarjeta','bizum','pendiente'],'')+'</div></div>'+
  '<div class="firma"><div class="fh"><span class="lb">Conforme con el trabajo (opcional)</span><button class="txt" id="tB" type="button">Borrar</button></div><canvas id="tF" aria-label="Zona para firmar con el dedo"></canvas></div></div>'+
  '<div class="hp"><button class="btn pri ancho" id="tOk" disabled>Cerrar el trabajo</button></div>',{papel:1,llena:1,fijo:1});
 pad=Oficio.firma($('#tF',d));$('#tB',d).onclick=()=>pad.borrar();
 d.addEventListener('click',e=>{const b=e.target.closest('[data-modo],#tOk');if(!b)return;if(b.dataset.modo){modo=b.dataset.modo;$('#tM',d).innerHTML=modos(['efectivo','tarjeta','bizum','pendiente'],modo);$('#tOk',d).disabled=false}
  else if(hacer({tipo:'terminar',id:A.id,modo,firma:pad.vacia()?'':pad.ruta()}).ok){d.close();toast(modo==='pendiente'?'Terminado. Queda por cobrar.':'Terminado y cobrado. Garantía de un año.');location.hash='#/papel/'+A.id+'/parte'}})}

/* ===== los toques ===== */
const ACC={
 menu:()=>hMenu(),
 imprimir:()=>window.print(),
 llamar:A=>hLlamar(A),
 msg:(A,b)=>hMsg(A,b.dataset.k),
 completar:A=>hCompletar(A),
 cita:A=>hCita(A),
 cancelar:A=>hCancelar(A),
 cobrar:A=>hCobrar(A),
 ampliar:A=>hPrecio(A,true),
 asignar:(A,b)=>{if(A.tec===b.dataset.tec)return;const antes=A.tec;if(hacer({tipo:'asignar',id:A.id,tec:b.dataset.tec}).ok)toast((antes?'Cambiado: ahora va ':'Asignado a ')+cfg.tec[b.dataset.tec].n+'.'+(A.cita?' Queda escrito el mensaje de la cita.':''))},
 voy:A=>{const r=hacer({tipo:'voy',id:A.id});if(r.ok){toast('De camino. Llegas sobre las '+K.hora(r.eta)+'.');if(ruta().v!=='aviso')location.hash='#/aviso/'+A.id}},
 ausente:A=>{if(hacer({tipo:'ausente',id:A.id}).ok){toast('Apuntado: no había nadie. Vuelve a la centralita.');location.hash='#/hoy'}},
 empezar:A=>{if(pro())hPrecio(A,false);else if(hacer({tipo:'empezar',id:A.id}).ok)toast('Empieza el trabajo.')},
 terminar:A=>{if(pro())hCierre(A);else if(hacer({tipo:'terminar',id:A.id}).ok){toast('Trabajo terminado.');location.hash='#/hoy'}},
 pausa:A=>{const r=hacer({tipo:'pausa',id:A.id});if(r.ok)toast(r.pausa?'En pausa: el tiempo no cuenta.':'Sigue el trabajo.')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();S=Oficio.estado();const A=b.dataset.id?el(b.dataset.id):null;if(b.dataset.id&&!A)return toast(ERR.estado);ACC[b.dataset.a](A,b);return}
 const o=e.target.closest('#fNuevo [data-b-av],#fNuevo [data-b-cu],#fNuevo [data-b-dia],#fNuevo [data-b-fr]');if(o){const x=o.dataset;if(x.bAv)B.av=x.bAv;if(x.bCu)B.cuando=x.bCu;if(x.bDia){B.dia=x.bDia;B.fr=''}if(x.bFr)B.fr=x.bFr;B.err='';pinta()}});
document.addEventListener('input',e=>{const i=e.target;if(i.dataset&&i.dataset.b){B[i.dataset.b]=i.value;
 if(i.dataset.b==='tel'){const t9=K.tel9(i.value),c=t9&&S.avisos.slice().reverse().find(a=>K.tel9(a.cli.tel)===t9);if(c&&!B.nombre&&!B.dir){B.nombre=c.cli.nombre;B.dir=c.cli.dir;B.cp=c.cli.cp;pinta();const n=$('#n_tel');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}});
document.addEventListener('change',e=>{const i=e.target;
 if(i.dataset&&i.dataset.obs)Oficio.hacer({tipo:'anotar',id:i.dataset.obs,obs:i.value},Q);
 if(i.dataset&&i.dataset.foto&&i.files[0])Oficio.foto(i.files[0]).then(f=>{if(hacer({tipo:'anotar',id:i.dataset.foto,foto:f}).ok)toast('Foto guardada en el parte.')}).catch(()=>toast('No he podido leer esa foto.'))});
document.addEventListener('submit',e=>{if(e.target.id!=='fNuevo')return;e.preventDefault();
 if(B.cuando==='cita'&&!B.fr){B.err='franja';pinta();return}
 const r=Oficio.hacer({tipo:'pedir',av:B.av,origen:'llamada',nota:B.nota,cli:{nombre:B.nombre,tel:B.tel,dir:B.dir,cp:B.cp},cita:B.cuando==='cita'?{dia:B.dia,fr:B.fr}:null},Q);
 if(r.ok){Object.assign(B,{av:'fuga',cuando:'urg',fr:'',nombre:'',tel:'',dir:'',cp:'',nota:'',err:''});toast('Aviso '+r.id+' creado. Ahora, asígnalo.');location.hash='#/aviso/'+r.id}
 else{B.err=r.err;pinta();const i=$('#n_'+(r.err==='zona'?'cp':r.err));if(i)i.focus();else toast(ERR[r.err]||'Revisa los datos.')}});
pinta();
})();
</script>
