<!doctype html>
<html lang="es" data-demo>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pide cita · Ramírez 24 h</title>
<meta name="description" content="Pide cita con Ramírez 24 h sin llamar: eliges la avería, el día y la franja. Con cita, tarifa normal. Web de muestra.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14171a">
<link rel="preload" href="assets/fuentes/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fuentes/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="oficio.css">
<style>
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px;background:var(--asfalto);border-bottom:1px solid var(--linea)}
@media (max-width:359px){#llama .ll-u{display:none}}
.wm{font:800 1.5rem/1 var(--fd);text-decoration:none;white-space:nowrap}
.wm span{margin-left:.22em;padding:.02em .22em;border-radius:4px;background:var(--senal);color:var(--negro)}
main{display:block;max-width:640px;margin:0 auto;padding:24px 18px calc(44px + var(--sb))}
main:focus{outline:0}
h1{font:800 1.75rem/1 var(--fd)}
.lead{margin-top:12px;font-size:1.125rem;color:var(--suave)}
.lead a{color:var(--texto);font-weight:600}
.ult{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--linea)}
.ult a{font-weight:600}
fieldset{border:0;min-width:0;display:grid;gap:14px;margin-top:30px}
legend{display:flex;gap:.45em;margin-bottom:14px;font:700 1.75rem/1 var(--fd)}
legend b{color:var(--senal)}
.avs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.avc{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;min-height:66px;padding:6px 10px 6px 6px;border-radius:12px;border:2px solid var(--control);font-weight:600;line-height:1.15;cursor:pointer}
.avc img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--asfalto-3)}
.avc input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avc:has(input:checked){border-color:var(--senal);background:var(--asfalto-3)}
.avc:has(input:focus-visible){outline:3px solid var(--senal);outline-offset:2px}
.rango{padding:12px 14px;border-radius:12px;background:var(--asfalto-2);border:1px solid var(--linea)}
.rango b{font:700 1.5rem/1.1 var(--fd)}
.rango small{display:block;margin-top:3px;font-size:.9375rem;color:var(--suave)}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{min-height:52px;padding:0 16px;border-radius:999px;border:2px solid var(--control);font-weight:600}
.op small{font-weight:400;color:var(--suave);margin-left:5px}
.op[aria-pressed=true]{border-color:var(--senal);background:var(--asfalto-3)}
.op[disabled]{border-style:dashed;color:var(--tenue);cursor:not-allowed}
.lb{font-size:.9375rem;font-weight:600}
.duo{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:12px}
.fotoz{display:flex;align-items:center;gap:12px}
.fotoz img{width:76px;height:57px;object-fit:cover;border-radius:8px}
.zona{font-size:.9375rem;color:var(--bien)}
.legal{margin-top:18px;font-size:.9375rem;color:var(--suave)}
form>.btn{margin-top:16px}
.fallo{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--mal-f);color:var(--mal);font-weight:600}
/* el resguardo del cliente: papel */
.doc h1{font:800 1.75rem/1 var(--fd)}
.doc .frase{margin-top:10px;font-size:1.125rem}
.doc .pista{margin:22px 0 6px}
.doc .pista li::before{background:var(--papel);border-color:#aeb4ba}
.doc .pista li::after{background:var(--raya)}
.doc .pista li.ok{color:var(--tinta)}
.doc .pista li.ok::before{background:var(--tinta);border-color:var(--tinta)}
.doc .pista li.ok::after{background:var(--tinta)}
.doc .pista li.ya::before{outline-color:rgba(23,25,27,.14)}
.doc .pista time{color:var(--tinta-2)}
.tras{display:grid;gap:10px;margin-top:18px}
.tras .txt{justify-self:center;display:inline-flex;align-items:center}
@media (min-width:560px){.avs{grid-template-columns:repeat(3,minmax(0,1fr))}h1,.doc h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="vh" href="#v">Saltar al contenido</a>
<header class="top">
 <a class="wm" href="./" aria-label="Ramírez 24 h: volver a la web">Ramírez<span>24 h</span></a>
 <button class="btn peq" id="llama" aria-label="¿Urgente? Llama al 930 00 00 00"><span class="ll-u">¿Urgente? </span>930 00 00 00</button>
</header>
<main id="v" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/oficio-nucleo.js"></script>
<script src="js/oficio-datos.js"></script>
<script src="js/oficio-estado.js"></script>
<script>
(function(){
'use strict';
const {K,N,cfg}=Oficio,$=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S=Oficio.estado();
const P=new URLSearchParams(location.search),av0=P.get('av')||mem.get('ramirez:av');
const B={av:cfg.av[av0]?av0:'',nota:'',foto:'',dia:'',fr:'',nombre:'',tel:'',dir:'',cp:'',err:''};
const ERR={av:'Elige qué te pasa.',franja:'Elige un día y una franja.',llena:'Esa franja se acaba de llenar. Elige otra.',nombre:'Escribe tu nombre.',tel:'El teléfono tiene que tener 9 cifras.',dir:'Escribe la calle y el número.',cp:'Falta el código postal.',zona:'Ahí todavía no llegamos: trabajamos en Barcelona ciudad.'};
const D3=['dom','lun','mar','mié','jue','vie','sáb'];
const diaCorto=f=>{const h=K.madrid().date;return f===h?'hoy':f===K.masDias(h,1)?'mañana':D3[new Date(f+'T12:00:00Z').getUTCDay()]+' '+(+f.slice(8))};
const frTxt=id=>{const f=cfg.franjas.find(x=>x.id===id);return f?'de '+f.de/60+' a '+f.a/60:''};
const toast=s=>{const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)};
const zonaDe=cp=>{const d=cfg.zonas.cp[String(cp).replace(/\D/g,'')];return d?cfg.zonas.dis[d][0]:''};

function vPedir(){const dias=K.diasDe(S,cfg,Date.now(),5);if(!dias.find(x=>x.dia===B.dia))B.dia=(dias.find(x=>!x.hoy)||dias[0]).dia;
 const fr=dias.find(x=>x.dia===B.dia).franjas;if(!fr.find(f=>f.id===B.fr&&f.ok))B.fr='';
 const R=B.av&&K.rango(cfg,B.av,false),ult=mem.get('oficio:'+N.id+':mio'),U=ult&&K.vistaCliente(S,cfg,ult);
 const c=(id,lb,v,o)=>'<div class="campo'+(B.err===id||(id==='cp'&&B.err==='zona')?' mal':'')+'"><label for="c_'+id+'">'+lb+'</label><input id="c_'+id+'" data-b="'+id+'" value="'+esc(v)+'" '+(o||'')+(B.err===id?' aria-invalid="true" aria-describedby="e_'+id+'"':'')+'>'+(B.err===id?'<p class="err" id="e_'+id+'">'+ERR[id]+'</p>':'')+'</div>';
 return'<h1>Pide cita sin prisa.</h1><p class="lead">Con cita, la tarifa es siempre la normal. ¿No puede esperar? <a href="./">Llama o manda una foto</a>: llegamos en 25–40 min.</p>'+
  (U&&U.e!=='cancelado'?'<p class="ult">Ya tienes un aviso: '+U.id+', '+esc(cfg.av[U.av].n.toLowerCase())+'. <a href="#/aviso/'+U.id+'">Ver cómo va</a></p>':'')+
  '<form id="f" novalidate>'+
  '<fieldset><legend><b>1</b>¿Qué pasa?</legend><div class="avs">'+N.averias.map(a=>'<label class="avc"><img src="assets/img/av-'+a.id+'-s.webp" alt="" width="52" height="52" loading="lazy"><span>'+esc(a.n)+'</span><input type="radio" name="av" value="'+a.id+'"'+(B.av===a.id?' checked':'')+'></label>').join('')+'</div>'+
   (B.err==='av'?'<p class="fallo">'+ERR.av+'</p>':'')+
   (R?'<p class="rango"><b class="num">'+(R.b?'De '+K.eur(R.a).replace(',00','')+' a '+K.eur(R.b).replace(',00',''):'Desde '+K.eur(R.a).replace(',00',''))+'</b><small>IVA incluido, en una vivienda. El precio exacto te lo cerramos antes de empezar y lo firmas.</small></p>':'')+
   '<div class="campo"><label for="c_nota">Cuéntanos algo más</label><textarea id="c_nota" data-b="nota" placeholder="Opcional. Por ejemplo: gotea debajo del fregadero.">'+esc(B.nota)+'</textarea></div>'+
   '<div class="fotoz">'+(B.foto?'<img src="'+B.foto+'" alt="La foto que has añadido">':'')+'<label class="btn peq">'+(B.foto?'Cambiar la foto':'Añadir una foto')+'<input class="vh" type="file" accept="image/*" id="c_foto"></label></div></fieldset>'+
  '<fieldset><legend><b>2</b>¿Cuándo te va bien?</legend><div class="ops" role="group" aria-label="Día">'+dias.map(x=>'<button type="button" class="op" data-dia="'+x.dia+'" aria-pressed="'+(B.dia===x.dia)+'">'+diaCorto(x.dia)+'</button>').join('')+'</div>'+
   '<div class="ops" role="group" aria-label="Franja">'+fr.map(f=>'<button type="button" class="op" data-fr="'+f.id+'" aria-pressed="'+(B.fr===f.id)+'"'+(f.ok?'':' disabled')+'>'+f.txt+'<small>'+(f.ok?(f.libres===1?'queda 1':'quedan '+f.libres):f.libres?'ya no da tiempo':'completa')+'</small></button>').join('')+'</div>'+
   (B.err==='franja'||B.err==='llena'?'<p class="fallo">'+ERR[B.err]+'</p>':'')+'</fieldset>'+
  '<fieldset><legend><b>3</b>¿Dónde vamos?</legend>'+c('nombre','Tu nombre',B.nombre,'autocomplete="name"')+c('tel','Teléfono, para avisarte por WhatsApp',B.tel,'type="tel" inputmode="tel" autocomplete="tel"')+
   '<div class="duo">'+c('dir','Calle, número y piso',B.dir,'autocomplete="street-address"')+c('cp','Código postal',B.cp,'inputmode="numeric" maxlength="5" autocomplete="postal-code"')+'</div>'+
   (B.err==='zona'?'<p class="fallo" id="zmal">'+ERR.zona+'</p>':zonaDe(B.cp)?'<p class="zona">'+esc(zonaDe(B.cp))+': llegamos.</p>':'')+'</fieldset>'+
  '<p class="legal">Usamos estos datos solo para atender tu aviso. Esto es una web de muestra: lo que escribas se queda en tu navegador y no llega a nadie.</p>'+
  '<button class="btn pri ancho" type="submit">Pedir la cita</button></form>'}

function vAviso(id){const v=K.vistaCliente(S,cfg,id);
 if(!v)return'<h1>No encuentro ese aviso.</h1><p class="lead">Puede que la demo se haya reiniciado. <a href="#/">Pedir una cita</a></p>';
 const av=cfg.av[v.av],cu=v.cita?K.fechaLarga(v.cita.dia)+', '+frTxt(v.cita.fr):'',T=v.tec||'El técnico';
 const orden={nuevo:0,ausente:0,cancelado:0,asignado:1,camino:2,curso:3,hecho:4}[v.e];
 const tit={nuevo:v.cita?'Cita pedida':'Aviso recibido',asignado:v.cita?'Cita confirmada':'Ya tiene técnico',camino:'Va de camino',curso:'Está en tu casa',hecho:v.sinTrabajo?'Aviso cerrado':'Trabajo terminado',ausente:'No había nadie',cancelado:'Cita cancelada'}[v.e];
 const frase={nuevo:v.cita?'Para el '+cu+'. Te confirmamos enseguida quién irá.':'Te decimos enseguida quién va y a qué hora llega.',
  asignado:v.cita?'El '+cu+'. Irá '+esc(T)+'.':'Irá '+esc(T)+'. Sale enseguida.',
  camino:esc(T)+' llega sobre las '+K.hora(v.eta)+'.',curso:esc(T)+' empezó a las '+K.hora(v.ini)+'. El precio ya está cerrado y firmado.',
  hecho:v.total?(v.sinTrabajo?'Solo se ha cobrado el desplazamiento: '+K.eur(v.total)+'.':'Total: '+K.eur(v.total)+', IVA incluido. '+(v.pago&&v.pago.cobrado?'Pagado.':'Pendiente de pago.')+(v.gar?' Garantía hasta el '+K.fechaCorta(v.gar)+'.':'')):'Gracias por confiar en '+N.nombre+'.'+(v.gar?' Garantía hasta el '+K.fechaCorta(v.gar)+'.':''),
  ausente:'Hemos ido y no hemos encontrado a nadie. Escríbenos y volvemos cuando te vaya bien.',cancelado:'Si quieres, pide otra cuando te vaya bien.'}[v.e];
 const p=[['Recibido',v.t],['Asignado',0],['De camino',v.sal],['En casa',v.ini],['Hecho',v.fin]];
 return'<article class="papel doc"><div class="dh"><span class="wm">Ramírez<span>24 h</span></span><p>Aviso '+v.id+'<br>'+esc(av.n)+'</p></div><h1 tabindex="-1" id="tit">'+tit+'</h1><p class="frase">'+frase+'</p>'+
  (v.e==='cancelado'?'':'<ol class="pista" aria-label="Cómo va tu aviso">'+p.map((x,i)=>'<li class="'+(i<=orden?'ok':'')+(i===orden?' ya':'')+'"'+(i===orden?' aria-current="step"':'')+'>'+x[0]+(x[1]&&i<=orden?'<time>'+K.hora(x[1])+'</time>':'')+'</li>').join('')+'</ol>')+
  '<p class="pie">'+(v.e==='hecho'?'El parte y la garantía te llegan por WhatsApp.':'Esta página se actualiza sola. También te avisamos por WhatsApp cuando el técnico salga.')+' ¿Algo no cuadra? Llama al '+N.tel+'.</p></article>'+
  '<div class="tras"><a class="btn ancho" href="app.html#/aviso/'+v.id+'" target="_top">Ver cómo le llega a Ramírez</a><a class="txt" href="#/">Pedir otra cita</a></div>'}

function ruta(){const h=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);return{v:h[0]||'',a:h[1]||''}}
function pinta(){S=Oficio.estado();const r=ruta();$('#v').innerHTML=r.v==='aviso'?vAviso(r.a):vPedir();document.title=(r.v==='aviso'?'Tu aviso '+r.a:'Pide cita')+' · Ramírez 24 h'}
addEventListener('hashchange',()=>{pinta();scrollTo(0,0);const t=$('#tit')||$('#v');t.focus({preventScroll:true})});
Oficio.suscribir(()=>{const a=document.activeElement;if(ruta().v!=='aviso'&&a&&a.closest&&a.closest('#f'))return;pinta()});
setInterval(()=>{if(ruta().v==='aviso')pinta()},60000);

document.addEventListener('input',e=>{const i=e.target;if(i.dataset&&i.dataset.b){B[i.dataset.b]=i.value;
 if(i.dataset.b==='cp'&&i.value.replace(/\D/g,'').length===5){B.err=zonaDe(i.value)?'':'zona';pinta();const n=$('#c_cp');n.focus();n.setSelectionRange(5,5)}}});
document.addEventListener('change',e=>{const i=e.target;
 if(i.name==='av'){B.av=i.value;mem.set('ramirez:av',B.av);if(B.err==='av')B.err='';pinta();const n=$('input[name=av]:checked');if(n)n.focus()}
 if(i.id==='c_foto'&&i.files[0])Oficio.foto(i.files[0]).then(f=>{B.foto=f;pinta()}).catch(()=>toast('No he podido leer esa foto.'))});
document.addEventListener('click',e=>{const b=e.target.closest('[data-dia],[data-fr],#llama');if(!b)return;
 if(b.id==='llama'){const d=document.createElement('dialog');d.className='hoja';d.innerHTML='<div class="hc"><h2>Llamada directa</h2><button class="x" data-x aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="hb"><p style="font:800 2.6rem/1 var(--fd)">'+N.tel+'</p><p style="color:var(--suave)">En la web real, este botón llama con un toque. En la demo no llamamos a nadie.</p></div><div class="hp"><button class="btn ancho" data-x>Cerrar</button></div>';
  document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',x=>{if(x.target===d||x.target.closest('[data-x]'))d.close()});d.showModal();return}
 if(b.dataset.dia){B.dia=b.dataset.dia;B.fr=''}else B.fr=b.dataset.fr;
 if(B.err==='franja'||B.err==='llena')B.err='';pinta();const n=$(b.dataset.dia?'[data-dia="'+B.dia+'"]':'[data-fr="'+B.fr+'"]');if(n)n.focus()});
document.addEventListener('submit',e=>{if(e.target.id!=='f')return;e.preventDefault();
 const falla=k=>{B.err=k;pinta();const i=$('#c_'+(k==='zona'?'cp':k))||$('.fallo');if(i){i.scrollIntoView({block:'center'});i.focus&&i.focus({preventScroll:true})}};
 if(!B.av)return falla('av');if(!B.fr)return falla('franja');
 const r=Oficio.hacer({tipo:'pedir',av:B.av,origen:'cita',nota:B.nota,foto:B.foto,cli:{nombre:B.nombre,tel:B.tel,dir:B.dir,cp:B.cp},cita:{dia:B.dia,fr:B.fr}},{rol:'cliente'});
 if(!r.ok)return falla(r.err==='franja'?'llena':r.err);
 mem.set('oficio:'+N.id+':mio',r.id);Object.assign(B,{nota:'',foto:'',fr:'',err:''});location.hash='#/aviso/'+r.id});
pinta();
})();
</script>
</body>
</html>
